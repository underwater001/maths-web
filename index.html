<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A question bank and knowledge web for SSC CGL Quant: past questions and practice as quizzes, sorted by topic, type, difficulty and how often they are asked, with fast methods, eliminations and traps.">
<title>Maths Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a radial web (centre → subjects → topics → concepts → question types) beside a reading panel; stacks on phones. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#eaeef3; --ink:#18212c; --muted:#5a6575; --line:#d6dce5;
  --accent:#2448c8; --new:#c97a06; --new-soft:#fbefd9; --hi:#b3261e; --hi-soft:#fde4e1;
  --ok:#1d7a46; --ok-soft:#e3f4ea;
  --display:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#151c25; --sunk:#1b2430; --ink:#e4e9f0; --muted:#97a2b2; --line:#2a3441;
  --accent:#86a2ff; --new:#ffb84a; --new-soft:#3a2b10; --hi:#ff8a80; --hi-soft:#3d1714;
  --ok:#6fd39b; --ok-soft:#143325; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#151c25; --sunk:#1b2430; --ink:#e4e9f0; --muted:#97a2b2; --line:#2a3441;
  --accent:#86a2ff; --new:#ffb84a; --new-soft:#3a2b10; --hi:#ff8a80; --hi-soft:#3d1714;
  --ok:#6fd39b; --ok-soft:#143325; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display)}
.page{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 20px;display:flex;flex-direction:column;gap:12px;min-height:100%;box-sizing:border-box}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px}
.brand h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-0.015em;line-height:1.1;text-wrap:balance}
.brand p{margin:4px 0 0;font-family:var(--mono);font-size:12px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13px;font-weight:500;padding:8px 12px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,440px);gap:14px;flex:1;min-height:0}
.web-wrap{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;height:min(80vh,900px);min-height:420px}
#web{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#web:active{cursor:grabbing}
.web-note{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5;pointer-events:none}
.web-note[hidden]{display:none!important}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 17px/1 var(--display);cursor:pointer}
.zoom button:focus-visible{outline:2px solid var(--accent)}
.key{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--mono);font-size:11px;color:var(--muted);background:color-mix(in srgb, var(--surface) 88%, transparent);padding:6px 8px;border-radius:6px;max-width:calc(100% - 70px)}
.key span{display:inline-flex;align-items:center;gap:5px}
.key i{display:inline-block;width:10px;height:10px;border-radius:50%}
.key .k-new{border:2px solid var(--new);width:8px;height:8px}
.key .k-link{width:16px;height:0;border-radius:0;border-top:1.5px dashed var(--muted)}

/* SVG */
.lk{fill:none;stroke-opacity:.42}
.xlk{fill:none;stroke:var(--muted);stroke-dasharray:3 4;stroke-opacity:.2;stroke-width:1.1}
.nd{cursor:pointer}
.nd circle.dot{stroke:var(--surface);stroke-width:1.5;transition:r .25s ease}
.nd .ring{fill:none;stroke:var(--new);stroke-width:2}
.nd text{font-family:var(--display);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.nd.br text{font-size:11.5px;font-weight:500}
.nd.jn text{font-size:13.5px;font-weight:800;letter-spacing:.01em}
.nd.hub text{font-size:11px;font-weight:800;fill:var(--surface);stroke:none}
.nd.root circle.dot{stroke-width:2.5}
.nd:focus{outline:none}
.nd:focus-visible circle.dot{stroke:var(--accent);stroke-width:3}
.nd.empty{opacity:.28}
.dimmed .nd:not(.lit){opacity:.16}
.dimmed .lk:not(.lit){stroke-opacity:.08}
.dimmed .xlk:not(.lit){stroke-opacity:.05}
.xlk.lit{stroke:var(--accent);stroke-opacity:.9;stroke-dasharray:none;stroke-width:1.6}
.nd.sel circle.dot{stroke:var(--ink);stroke-width:2.5}
.nd.hit circle.dot{stroke:var(--accent);stroke-width:3}
.webcrumb{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;background:color-mix(in srgb, var(--surface) 90%, transparent);padding:6px 10px;border-radius:8px;border:1px solid var(--line);max-width:calc(100% - 20px)}
.webcrumb button{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;font-weight:700}
.webcrumb button:hover{text-decoration:underline}
.webcrumb span{color:var(--muted)}
.webcrumb b{color:var(--ink);font-weight:700}
.webcrumb[hidden]{display:none!important}
.guide-ring{fill:none;stroke:var(--line);stroke-dasharray:2 7}

/* Panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 18px 22px;overflow:auto;height:min(80vh,900px);min-height:420px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.panel h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-0.01em;line-height:1.15;text-wrap:balance}
.panel h3{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel p.lead{margin:0;font-family:var(--body);font-size:15.5px;line-height:1.5;color:var(--ink)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12.5px;color:var(--muted)}
.crumbs button{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
.crumbs button:hover{text-decoration:underline}
.meta-row{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta-row .soft{font-style:italic;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left}
.chip:hover{border-color:var(--muted)}
.chip:focus-visible{outline:2px solid var(--accent)}
.chip i{width:8px;height:8px;border-radius:50%;flex:none}
.chip .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip .nw{font-family:var(--mono);font-size:10px;color:var(--new);font-weight:500}
.section{display:flex;flex-direction:column;gap:8px}
.date-h{font-family:var(--mono);font-size:12px;color:var(--muted);padding-bottom:4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.tag{padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.03em}
.tag.bg{border:1px dashed var(--line);color:var(--muted)}
.tag.fresh{background:var(--new-soft);color:var(--new)}
.tag.p-high{background:var(--hi-soft);color:var(--hi)}
.tag.p-medium{border:1px solid var(--line);color:var(--ink)}
.tag.p-low{color:var(--muted);opacity:.8}
.empty-msg{font-family:var(--body);font-size:15px;color:var(--muted);line-height:1.5;margin:0}
.btn-link{font:inherit;font-size:13px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;align-self:flex-start}
.jgroup{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.jgroup h3 i{width:10px;height:10px;border-radius:50%}

/* maths content */
.formula{border:1px solid var(--line);border-radius:6px;padding:9px 11px;display:flex;flex-direction:column;gap:3px;background:var(--sunk)}
.formula .tx{font:500 13px/1.5 var(--mono);overflow-wrap:anywhere}
.formula .nt{font-family:var(--body);font-size:14px;color:var(--muted);line-height:1.45}
.ledger{display:grid;grid-template-columns:5.6rem minmax(0,1fr);gap:10px 12px;margin:0}
.ledger dt{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);padding-top:3px}
.ledger dt.trap{color:var(--hi)}
.ledger dd{margin:0;min-width:0;font-family:var(--body);font-size:15px;line-height:1.5}
.ledger ul{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:4px}
.q{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:9px}
.q .src{font:500 12px var(--mono);color:var(--accent)}
.q .src a{color:inherit}
.q p{margin:0;font-family:var(--body);font-size:15.5px;line-height:1.5}
.opts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:6px}
.opts li,.opts button.opt{font:500 13px var(--mono);border:1px solid var(--line);border-radius:6px;padding:6px 9px;display:flex;gap:7px;min-width:0;background:var(--surface);color:var(--ink);text-align:left}
.opts li span,.opts button.opt span{color:var(--muted)}
.opts button.opt{cursor:pointer}
.opts button.opt:hover{border-color:var(--muted)}
.opts button.opt:focus-visible{outline:2px solid var(--accent)}
.opts button.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opts button.opt.wrong{background:var(--hi-soft);border-color:var(--hi)}
.opts button.opt[disabled]{cursor:default}
details summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
details[open] summary{margin-bottom:8px}
.sol{display:flex;flex-direction:column;gap:6px;font-family:var(--body);font-size:15px}
.sol .key-a{font:600 13px var(--mono);color:var(--ok)}
.sol ol{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:4px}
.lv{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lv.harder{color:var(--hi)}
.why{font-family:var(--body);font-size:14.5px;color:var(--muted);margin:0}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rows li{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rows li:last-child{border-bottom:0}
.rows .ref{font:500 12px var(--mono);color:var(--accent)}
.rows .ans{font:500 12.5px var(--mono);color:var(--ink)}
.rows .ref a{color:inherit}
.note{font-family:var(--body);font-size:14px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin:0;line-height:1.5}

@media (max-width: 900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .web-wrap{height:62vh;min-height:360px}
  .panel{height:auto;min-height:0;overflow:visible}
  .brand h1{font-size:22px}
}
@media (max-width: 520px){ .ledger{grid-template-columns:1fr;gap:2px} .ledger dd{margin-bottom:8px} }
.nav{display:flex;gap:14px;margin-top:6px;font:500 13px var(--mono)}
.nav a{color:var(--accent);text-decoration:none}
.nav a:hover{text-decoration:underline}

/* question bank */
.tabs{margin-left:auto}
.bank{display:grid;grid-template-columns:minmax(230px,290px) minmax(0,1fr);gap:14px;align-items:start;flex:1}
.bank[hidden],.layout[hidden]{display:none!important}
.filters{position:sticky;top:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:13px;min-width:0}
.filters .f{display:flex;flex-direction:column;gap:5px;font:500 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);min-width:0}
.filters select{font:500 14px var(--display);text-transform:none;letter-spacing:0;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
.filters select:focus-visible{outline:2px solid var(--accent)}
.tg{display:flex;flex-wrap:wrap;gap:5px}
.tg button{font:500 12.5px var(--display);text-transform:none;letter-spacing:0;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tg button:focus-visible{outline:2px solid var(--accent)}
.fcount{font:500 12.5px var(--mono);color:var(--ink);text-transform:none;letter-spacing:0}
.cards{display:flex;flex-direction:column;gap:12px;min-width:0}
.cards .more{align-self:center;font:600 13px var(--display);padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.lvl{font:600 11px/1 var(--mono);letter-spacing:.04em;padding:3px 7px;border-radius:4px;border:1px solid var(--line)}
.lvl-Easy{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.lvl-Medium{background:var(--new-soft);color:var(--new);border-color:transparent}
.lvl-Hard{background:var(--hi-soft);color:var(--hi);border-color:transparent}
.tag.lik-high{background:var(--hi-soft);color:var(--hi)}
.tag.lik-medium{border:1px solid var(--line);color:var(--ink)}
.tag.lik-low,.tag.lik-not-seen{color:var(--muted);border:1px dashed var(--line)}
.tag.tech{border:1px solid var(--line);color:var(--muted);font-weight:400}
.qbtn{font:600 13px var(--display);align-self:flex-start;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer}
.qbtn:focus-visible{outline:2px solid var(--accent)}
.rv{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.rv[hidden]{display:none!important}
.verdict{font:600 14px var(--display)}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--hi)}
.rv h4{margin:0 0 4px;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.rv .sol ol{margin:0;padding-left:1.2rem}
.rv .trick{font-family:var(--body);font-size:15px;line-height:1.5;background:var(--sunk);border-radius:6px;padding:8px 10px}
.rv ul.wn{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-family:var(--body);font-size:14.5px;line-height:1.45}
.rv ul.wn li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px}
.rv ul.wn b{font:500 12.5px var(--mono)}
.rv ul.wn em{font:500 10.5px var(--mono);font-style:normal;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.rv ul.wn em.mistake{color:var(--hi)}
.rv .tags{display:flex;flex-wrap:wrap;gap:5px}
.statline{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.statline b{color:var(--ink);font-weight:500}
.mix{display:flex;gap:10px;font:500 12px var(--mono)}
.btn{font:700 13.5px var(--display);align-self:flex-start;padding:9px 14px;border-radius:8px;border:0;background:var(--accent);color:var(--surface);cursor:pointer}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.variations{margin:0;padding-left:1.1rem;font-family:var(--body);font-size:15px;line-height:1.5;display:flex;flex-direction:column;gap:3px}
@media (max-width: 900px){ .bank{grid-template-columns:minmax(0,1fr)} .filters{position:static} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

[hidden]{display:none!important}
/* bank: by topic */
.bankwrap{display:flex;flex-direction:column;gap:12px;flex:1}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c,var(--muted));border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tcard h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-0.01em}
.tcard .sub{font-family:var(--body);font-size:14.5px;color:var(--muted);margin:0;line-height:1.45}
.tcard .btns{display:flex;flex-wrap:wrap;gap:8px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .ok{background:var(--ok)} .bar .no{background:var(--hi)}
.weak{font:500 12px var(--mono);color:var(--hi)}
.waiting{opacity:.8}
/* sources */
.srcwrap{display:flex;flex-direction:column;gap:14px;max-width:980px}
.srcwrap h2{margin:0;font-size:22px;font-weight:800}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:9px;min-width:0}
.pcard h3{margin:0;font-size:16px;font-weight:700}
.plist{width:100%;border-collapse:collapse;font-size:13.5px}
.plist th,.plist td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.plist th{font:500 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tscroll{overflow-x:auto}
.ext{color:var(--accent);font-weight:600;text-decoration:none}
.ext:hover{text-decoration:underline}
/* learn */
.lhead{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.lhead h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-0.01em;text-wrap:balance}
.lgrid{display:grid;grid-template-columns:minmax(210px,260px) minmax(0,1fr);gap:14px;align-items:start}
.outline{position:sticky;top:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 24px);overflow:auto;min-width:0}
.outline button.oi{font:500 13.5px var(--display);text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;color:var(--ink);cursor:pointer;display:grid;grid-template-columns:1.1rem minmax(0,1fr);gap:6px;align-items:baseline}
.outline button.oi:hover{background:var(--sunk)}
.outline button.oi.cur{background:var(--ink);color:var(--surface)}
.outline button.oi.t2{padding-left:22px;font-size:13px;color:var(--muted)}
.outline button.oi.t2.cur{color:var(--surface)}
.outline button.oi:focus-visible{outline:2px solid var(--accent)}
.outline .mk{font:600 11px var(--mono);color:var(--ok)}
.otoggle{display:none}
.lmain{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.lmain h2{margin:0;font-size:23px;font-weight:800;letter-spacing:-0.01em;line-height:1.15;text-wrap:balance}
.lmain h3{margin:0;font-size:14px;font-weight:700}
.lmain .lead{margin:0;font-family:var(--body);font-size:16.5px;line-height:1.55}
.lnav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px}
.lnav .btn[disabled]{opacity:.4;cursor:default}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--sunk);display:flex;flex-direction:column;gap:2px}
.tile b{font:700 22px var(--display)}
.tile span{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.capsule{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:8px}
.capsule div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-family:var(--body);font-size:15px;line-height:1.45;background:var(--sunk)}
.capsule div b{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.capsule .tp b{color:var(--hi)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--new-soft);border-radius:8px;padding:9px 12px;font-size:14px}
.banner button{font:600 13px var(--display);color:var(--accent);background:none;border:0;cursor:pointer;padding:0}
.cur-list{display:flex;flex-direction:column;gap:10px}
.cur-list .c{display:flex;flex-direction:column;gap:6px}
.qprog{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.qprog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.lq{display:flex;flex-direction:column;gap:12px}
.lq .qtext{margin:0;font-family:var(--body);font-size:18px;line-height:1.55}
.lq .opts{grid-template-columns:repeat(auto-fit,minmax(11rem,1fr))}
.lq .opts button.opt{font-size:14.5px;padding:10px 12px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.score{font:800 40px var(--display);letter-spacing:-0.02em}
@media (max-width: 900px){
  .lgrid{grid-template-columns:minmax(0,1fr)}
  .outline{position:static;max-height:none;display:none}
  .outline.open{display:flex}
  .otoggle{display:inline-flex;align-self:flex-start;font:600 13px var(--display);padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer}
  .lmain{padding:14px}
}
</style>
<style id="jstyles"></style>
</head>
<body>
<div class="page">
<header class="top">
    <div class="brand">
      <h1>Maths Web</h1>
      <p id="sub">Loading the web…</p>
      <nav class="nav" aria-label="Site"><a href="https://github.com/underwater001/maths-web">GitHub</a></nav>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="controls">
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search formulas, tricks, question types, topics" autocomplete="off" aria-label="Search">
    </label>
    <div class="seg tabs" role="group" aria-label="View" id="tabs">
      <button type="button" data-view="web" aria-pressed="true">Web</button>
      <button type="button" data-view="bank" aria-pressed="false">Question bank</button>
      <button type="button" data-view="sources" aria-pressed="false">Sources</button>
    </div>
    <div class="seg" role="group" aria-label="Show" id="show" title="Which topics to highlight on the web">
      <button type="button" data-v="all" aria-pressed="true">All topics</button>
      <button type="button" data-v="pyq" aria-pressed="false">Has past questions</button>
      <button type="button" data-v="built" aria-pressed="false">Fully built</button>
    </div>
  </div>

  <main class="layout">
    <section class="web-wrap" aria-label="Knowledge web">
      <svg id="web" role="img" aria-label="Radial map of maths subjects and topics; tap a topic to open its concepts and question types"></svg>
      <div class="web-note" id="note">Loading the web…</div>
      <div class="webcrumb" id="webcrumb" hidden></div>
      <div class="key" aria-hidden="true">
        <span><i class="k-new"></i>fully built</span>
        <span><i class="k-link"></i>related topics</span>
        <span>dot size = past questions</span>
        <span>tap a topic to zoom in</span>
      </div>
      <div class="zoom">
        <button type="button" id="zin" aria-label="Zoom in">+</button>
        <button type="button" id="zout" aria-label="Zoom out">−</button>
        <button type="button" id="zfit" aria-label="Fit whole web" style="font-size:13px">⤢</button>
      </div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>

  <section class="bankwrap" id="bank" hidden aria-label="Question bank">
    <div class="seg" role="group" aria-label="Question bank view" id="btabs" style="align-self:flex-start">
      <button type="button" data-bt="topic" aria-pressed="true">By topic</button>
      <button type="button" data-bt="mixed" aria-pressed="false">Mixed practice</button>
    </div>
    <div id="bytopic"></div>
    <div class="bank" id="mixed" hidden>
      <aside class="filters" id="filters"></aside>
      <div class="cards" id="cards" aria-live="polite"></div>
    </div>
  </section>

  <section id="learn" hidden aria-label="Learn a topic">
    <div class="lhead" id="lhead"></div>
    <div class="lgrid">
      <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
        <button type="button" class="otoggle" id="otoggle">Outline</button>
        <nav class="outline" id="outline" aria-label="Topic outline"></nav>
      </div>
      <article class="lmain" id="lmain" aria-live="polite"></article>
    </div>
  </section>

  <section id="sources" hidden aria-label="Sources"></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
(function(){
/* State. core.json is loaded at start (nodes, papers, stats, a light list of every question). A topic's shard
   (formulas, methods, full questions) is fetched only when that topic is opened, so start-up cost stays flat as the bank grows. */
const S = { nodes:new Map(), papers:[], stats:{papers:0,topics:{},qtypes:{}}, tmeta:{}, rows:[], techniques:{}, rubric:{}, likNote:'',
            sd:{}, sp:{}, refs:[], bankTab:'topic', show:'all', q:'', sel:null, view:'web', status:'loading', loaded:false, fittedScope:undefined, webFocus:null, cnt:new Map(), built:new Set(),
            f:{topic:'', qtype:'', level:new Set(), lik:new Set(), src:'', status:'', tech:'', sort:'asked'}, shown:20, prog:{} };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const plural = (n,w) => n + ' ' + w + (n===1?'':(/(ch|sh|s|x)$/.test(w)?'es':'s'));
const LAYERS = [['standard','Standard'],['fast','Fast'],['ultra','Ultra-calc'],['eliminate','Eliminate']];
const LEVELS = ['Easy','Medium','Hard'];
const LIKS = [['high','High'],['medium','Medium'],['low','Low']];

/* ---------- progress (this browser only) ---------- */
function loadProg(){ try { return JSON.parse(localStorage.getItem('mw-progress')||'{}') || {}; } catch(e){ return {}; } }
function saveProg(){ try { localStorage.setItem('mw-progress', JSON.stringify(S.prog)); } catch(e){} }
S.prog = loadProg();

/* ---------- derived data ---------- */
function parentOf(n){ const p = n && n.parent; return (p && p !== 'hub' && S.nodes.has(p)) ? p : 'hub'; }
function junctionOf(id){ let cur = S.nodes.get(id), guard = 0; while(cur && parentOf(cur) !== 'hub' && guard++ < 20) cur = S.nodes.get(parentOf(cur)); return cur ? cur.id : null; }
function topicOf(id){ let cur = S.nodes.get(id), guard = 0; while(cur && cur.kind !== 'topic' && guard++ < 20) cur = S.nodes.get(parentOf(cur)); return cur && cur.kind==='topic' ? cur.id : null; }
function color(id){ const j = junctionOf(id); return j ? `var(--j-${j})` : 'var(--muted)'; }
function kidsOf(id){ return [...S.nodes.values()].filter(m => parentOf(m)===id).sort((a,b)=>(a.order??999)-(b.order??999)||a.label.localeCompare(b.label)); }
function descendants(id){ const out = new Set([id]); let added = true; while(added){ added=false; for(const n of S.nodes.values()){ if(!out.has(n.id) && out.has(parentOf(n))){ out.add(n.id); added=true; } } } return out; }
function linksOf(id){ const s = new Set(); const n = S.nodes.get(id); (n && n.links || []).forEach(x => S.nodes.has(x) && s.add(x)); for(const m of S.nodes.values()) if((m.links||[]).includes(id)) s.add(m.id); s.delete(id); return s; }
function paper(id){ return S.papers.find(p => p.id === id); }
const qstat = id => S.stats.qtypes[id], tstat = id => S.stats.topics[id];
function derive(){
  S.cnt = new Map();
  for (const n of S.nodes.values()){
    let c = 0;
    if (n.kind === 'qtype') c = (qstat(n.id)||{}).n || 0;
    else if (n.kind === 'topic' && !kidsOf(n.id).length) c = (tstat(n.id)||{}).n || 0;
    S.cnt.set(n.id, c);
  }
  S.built = new Set();
  for (const [t,m] of Object.entries(S.tmeta)) if (m.built){
    descendants(t).forEach(x => S.built.add(x));
    let cur = S.nodes.get(t), g2 = 0; while (cur && g2++ < 20){ S.built.add(cur.id); const p = parentOf(cur); if (p === 'hub') break; cur = S.nodes.get(p); }
  }
}
function subCount(id){ let t = S.cnt.get(id)||0; kidsOf(id).forEach(k => t += subCount(k.id)); return t; }
function passes(id){ const n = S.nodes.get(id); if (!n || parentOf(n)==='hub') return true;
  if (S.show === 'pyq') return subCount(id) > 0; if (S.show === 'built') return S.built.has(id); return true; }
function q(){ return S.q.toLowerCase(); }
function nodeHit(n){ return S.q && n.label.toLowerCase().includes(q()); }
function nodeOrDescHit(id){ if (nodeHit(S.nodes.get(id))) return true; return kidsOf(id).some(k => nodeOrDescHit(k.id)); }

/* ---------- data: lazy shards ---------- */
const get = async (p, v) => {
  if (window.__DATA__ && window.__DATA__[p]) return window.__DATA__[p];
  const r = await fetch(p + '?v=' + (v || Date.now()), {cache: v ? 'default' : 'no-store'}); if (!r.ok) throw new Error(p + ' ' + r.status); return r.json();
};
function loadShard(t){
  if (!t || !(S.tmeta[t] && S.tmeta[t].built)) return Promise.resolve(null);
  if (!S.sp[t]) S.sp[t] = get('data/shards/' + t + '.json', S.tmeta[t].v).then(d => {
    d.byId = new Map([...d.pyqs.map(x => [x.id, Object.assign({src:'pyq', topic:t}, x)]), ...d.practice.map(x => [x.id, Object.assign({src:'practice', topic:t}, x)])]);
    S.sd[t] = d; return d; });
  return S.sp[t];
}
const allBuilt = () => Object.keys(S.tmeta).filter(t => S.tmeta[t].built);
const formulasOf = t => (S.sd[t] ? S.sd[t].formulas : []);

/* ---------- junction colours ---------- */
function paintJunctions(){
  const js = [...S.nodes.values()].filter(n => parentOf(n)==='hub').sort((a,b)=>(a.order??99)-(b.order??99));
  let light='', dark='';
  js.forEach((j,i) => { const h = Number.isFinite(j.hue) ? j.hue : Math.round((250 + i*360/Math.max(js.length,1))%360);
    light += `--j-${j.id}:oklch(0.56 0.15 ${h});`; dark += `--j-${j.id}:oklch(0.78 0.12 ${h});`; });
  $('jstyles').textContent = `:root{${light}} @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${dark}}} :root[data-theme="dark"]{${dark}}`;
}

/* ---------- web ---------- */
const svg = d3.select('#web');
const g = svg.append('g');
const zoom = d3.zoom().scaleExtent([0.25,5]).on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom).on('dblclick.zoom', null);
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
$('zin').onclick = () => svg.transition().duration(reduce?0:250).call(zoom.scaleBy, 1.35);
$('zout').onclick = () => svg.transition().duration(reduce?0:250).call(zoom.scaleBy, 1/1.35);
$('zfit').onclick = () => fit(true);
svg.on('click', e => { if (e.target === svg.node()) select(null); });

/* One thread per pair of topics that share a cross-link anywhere in their subtree (the overview's faint constellation). */
function topicPairLinks(){
  const pairs = new Map();
  for (const n of S.nodes.values()){
    const ta = topicOf(n.id); if (!ta) continue;
    for (const l of (n.links||[])){
      const tb = topicOf(l); if (!tb || tb===ta) continue;
      const k = [ta,tb].sort().join('|');
      if (!pairs.has(k)) pairs.set(k, {a:ta,b:tb});
    }
  }
  return [...pairs.values()];
}

let layoutPts = new Map();
/* scope=null: the whole map, stopped at topic level, so it never gets crowded.
   scope=a topic id: just that topic's own concepts and question types, as its own small web. */
function buildHierarchy(scope){
  const kids = new Map();
  for (const n of S.nodes.values()){ const p = parentOf(n); if(!kids.has(p)) kids.set(p, []); kids.get(p).push(n); }
  const sortK = a => a.sort((x,y)=>(x.order??999)-(y.order??999) || String(x.label).localeCompare(String(y.label)));
  if (scope){
    const make = id => ({ id, children: sortK(kids.get(id)||[]).map(n => make(n.id)) });
    return d3.hierarchy(make(scope));
  }
  const make = (id, depth) => ({ id, children: depth >= 2 ? [] : sortK(kids.get(id)||[]).map(n => make(n.id, depth+1)) });
  return d3.hierarchy(make('hub', 0));
}
function drawWeb(){
  g.selectAll('*').remove();
  if (!S.nodes.size){ return; }
  if (S.webFocus && !S.nodes.has(S.webFocus)) S.webFocus = null;
  const scope = S.webFocus;
  const root = buildHierarchy(scope);
  const leaves = root.leaves().length;
  const maxDepth = d3.max(root.descendants(), d => d.depth) || 1;
  const R = Math.max(400, leaves * 24 / (2*Math.PI));
  d3.tree().size([2*Math.PI, R]).separation((a,b) => (a.parent===b.parent?1:1.8)/Math.min(Math.max(a.depth,1),2))(root);
  const r1 = R*0.38;
  root.each(d => { d.y = d.depth===0 ? 0 : d.depth===1 ? r1 : r1 + (d.depth-1)*((R-r1)/Math.max(maxDepth-1,1)); });
  const pt = d => [d.y*Math.sin(d.x), -d.y*Math.cos(d.x)];
  layoutPts = new Map(root.descendants().map(d => [d.data.id, {x:d.x, y:d.y, p:pt(d), depth:d.depth}]));

  const hits = new Set(); if (S.q) for (const d of root.descendants()) if (d.depth>0 && nodeOrDescHit(d.data.id)) hits.add(d.data.id);

  g.append('circle').attr('class','guide-ring').attr('r', r1);

  g.append('g').selectAll('path').data(root.links()).join('path')
    .attr('class', d => 'lk lk-' + d.target.data.id)
    .attr('d', d3.linkRadial().angle(d=>d.x).radius(d=>d.y))
    .attr('stroke', d => d.source.depth===0 ? 'var(--line)' : color(d.target.data.id))
    .attr('stroke-width', d => d.source.depth===0 ? 2 : 1 + Math.min(4, Math.sqrt(subCount(d.target.data.id))*0.6));

  const xl = scope ? (() => {
    const out = [], seen = new Set();
    for (const n of S.nodes.values()) for (const t of (n.links||[])){
      if (!layoutPts.has(n.id) || !layoutPts.has(t)) continue;
      const k = [n.id,t].sort().join('|'); if (seen.has(k)) continue; seen.add(k); out.push({a:n.id,b:t});
    }
    return out;
  })() : topicPairLinks().filter(p => layoutPts.has(p.a) && layoutPts.has(p.b));
  g.append('g').selectAll('path').data(xl).join('path')
    .attr('class', d => `xlk x-${d.a} x-${d.b}`)
    .attr('d', d => { const A = layoutPts.get(d.a).p, B = layoutPts.get(d.b).p; const c = [(A[0]+B[0])*0.28, (A[1]+B[1])*0.28]; return `M${A[0]},${A[1]} Q${c[0]},${c[1]} ${B[0]},${B[1]}`; });

  const node = g.append('g').selectAll('g').data(root.descendants()).join('g')
    .attr('class', d => { const id=d.data.id; const c=['nd'];
      c.push(d.depth===0 ? (scope?'root':'hub') : d.depth===1 ? 'jn' : 'br');
      if (d.depth>1 && !passes(id)) c.push('empty'); if (hits.has(id)) c.push('hit'); return c.join(' '); })
    .attr('data-id', d => d.data.id)
    .attr('transform', d => { const [x,y] = pt(d); return `translate(${x},${y})`; })
    .attr('tabindex', d => (d.depth===0 && !scope) ? null : 0)
    .attr('role', d => (d.depth===0 && !scope) ? null : 'button')
    .attr('aria-label', d => { if(d.depth===0 && !scope) return null; if (d.depth===0) return `${S.nodes.get(scope).label}, zoom back out to all topics`; const n=S.nodes.get(d.data.id); return `${n.label}, ${plural(subCount(d.data.id),'past question')}`; })
    .on('click', (e,d) => { e.stopPropagation();
      if (d.depth===0){ if (scope) zoomOutWeb(); else activate(null); } else activate(d.data.id);
      if (S.view==='web' && window.innerWidth <= 900) $('panel').scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'start'}); })
    .on('keydown', (e,d) => { if (e.key==='Enter' || e.key===' '){ e.preventDefault();
      if (d.depth===0 && scope) zoomOutWeb(); else activate(d.data.id); } });

  const rad = d => d.depth===0 ? 24 : d.depth===1 ? (scope ? Math.min(15, 7+Math.sqrt(subCount(d.data.id))*1.6) : 11) : Math.min(13, 4 + Math.sqrt(subCount(d.data.id))*1.9);
  node.filter(d => (d.depth>1 || (d.depth===0 && scope)) && S.built.has(d.data.id))
    .append('circle').attr('class','ring').attr('r', d => rad(d)+3.5);
  node.append('circle').attr('class','dot').attr('r', rad)
    .attr('fill', d => d.depth===0 ? (scope ? color(scope) : 'var(--ink)') : color(d.data.id));
  node.append('title').text(d => d.depth===0 ? (scope ? `${S.nodes.get(scope).label} · tap to zoom out` : 'SSC CGL Quant') : `${S.nodes.get(d.data.id).label} · ${plural(subCount(d.data.id),'past question')}`);

  /* The focused root's own name is already in the breadcrumb and the panel title, so it isn't
     re-inscribed here (a label above the dot would cross its own spokes); the ring above marks it instead. */
  node.filter(d=>d.depth===0 && !scope).append('text').attr('text-anchor','middle').attr('dy','0.35em').text('Quant');
  node.filter(d=>d.depth===1).append('text')
    .attr('dy','0.35em')
    .attr('transform', d => { const deg = d.x*180/Math.PI - 90; return d.x < Math.PI ? `rotate(${deg})` : `rotate(${deg+180})`; })
    .attr('x', d => (d.x < Math.PI ? -1 : 1) * 16)
    .attr('text-anchor', d => d.x < Math.PI ? 'end' : 'start')
    .text(d => S.nodes.get(d.data.id).short || S.nodes.get(d.data.id).label);
  node.filter(d=>d.depth>1).append('text')
    .attr('dy','0.32em')
    .attr('transform', d => { const deg = d.x*180/Math.PI - 90; return d.x < Math.PI ? `rotate(${deg})` : `rotate(${deg+180})`; })
    .attr('x', d => (d.x < Math.PI ? 1 : -1) * (d.children ? -1 : 1) * (rad(d)+5))
    .attr('text-anchor', d => (d.x < Math.PI) !== !!d.children ? 'start' : 'end')
    .text(d => S.nodes.get(d.data.id).short || S.nodes.get(d.data.id).label);

  renderWebCrumb(scope);
  applyHighlight();
  maybeFit();
}
function renderWebCrumb(scope){
  const el = $('webcrumb');
  if (!scope){ el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  const j = junctionOf(scope);
  el.innerHTML = `<button type="button" data-zoomout>← All topics</button>${j?`<span>${esc(S.nodes.get(j).label)} ›</span>`:''}<b>${esc(S.nodes.get(scope).label)}</b>`;
}
function applyHighlight(){
  const lit = new Set();
  if (S.sel && S.nodes.has(S.sel)){
    let cur = S.sel, guard=0; while(cur && cur!=='hub' && guard++<20){ lit.add(cur); cur = parentOf(S.nodes.get(cur)); }
    descendants(S.sel).forEach(x => lit.add(x)); linksOf(S.sel).forEach(x => lit.add(x)); lit.add('hub');
  } else if (S.q){
    g.selectAll('.nd.hit').each(function(){ lit.add(this.getAttribute('data-id')); }); lit.add('hub');
    [...lit].forEach(id => { let cur = S.nodes.get(id), guard=0; while(cur && guard++<20){ lit.add(cur.id); const p = parentOf(cur); if(p==='hub') break; cur = S.nodes.get(p); } });
  }
  g.classed('dimmed', lit.size > 0);
  g.selectAll('.nd').classed('lit', function(){ return lit.has(this.getAttribute('data-id')); }).classed('sel', function(){ return this.getAttribute('data-id')===S.sel; });
  g.selectAll('.lk').classed('lit', d => lit.has(d.target.data.id) && lit.has(d.source.data.id));
  g.selectAll('.xlk').classed('lit', d => S.sel && (d.a===S.sel || d.b===S.sel));
}
function fit(animate){
  const el = svg.node(); const b = g.node().getBBox(); const w = el.clientWidth, h = el.clientHeight;
  if (!b.width || !w || !h) return;
  const s = Math.min(w/(b.width+30), h/(b.height+30), 2.2);
  const t = d3.zoomIdentity.translate(w/2 - s*(b.x+b.width/2), h/2 - s*(b.y+b.height/2)).scale(s);
  (animate && !reduce ? svg.transition().duration(400) : svg).call(zoom.transform, t);
}

const likTag = st => { const l = st ? st.lik : 'not seen'; const n = S.stats.papers; return `<span class="tag lik-${likKey(l)}" title="${st ? `Asked in ${st.shifts} of ${n} analysed shifts` : 'Not seen in the papers analysed so far'}">${l==='not seen'?'not seen yet':l+' likelihood'}</span>`; };
function whyText(w){ if(!w) return ''; const bits=[`${w.steps} step${w.steps===1?'':'s'}`]; if(w.concepts>1) bits.push(`${w.concepts} concepts`); if(w.heavy) bits.push('heavy numbers'); if(w.trap) bits.push('a common-mistake option'); return bits.join(', '); }

/* ---------- question bank: mixed practice ---------- */
function matchRows(){
  const f = S.f;
  const rows = S.rows.filter(r => {
    if (f.topic && r.topic !== f.topic) return false;
    if (f.qtype && r.qtype !== f.qtype) return false;
    if (f.level.size && !f.level.has(r.level)) return false;
    if (f.lik.size && !f.lik.has((qstat(r.qtype)||{lik:'not seen'}).lik)) return false;
    if (f.src && r.src !== f.src) return false;
    if (f.tech && !r.tech.includes(f.tech)) return false;
    const pr = S.prog[r.id];
    if (f.status === 'new' && pr) return false;
    if (f.status === 'wrong' && !(pr && !pr.r)) return false;
    if (f.status === 'right' && !(pr && pr.r)) return false;
    return true;
  });
  const lv = r => LEVELS.indexOf(r.level), sh = r => (qstat(r.qtype)||{shifts:0}).shifts, nn = r => (qstat(r.qtype)||{n:0}).n;
  const tie = (a,b) => (a.src===b.src?0:a.src==='pyq'?-1:1) || a.id.localeCompare(b.id);
  const by = {
    asked: (a,b) => sh(b)-sh(a) || nn(b)-nn(a) || lv(a)-lv(b) || tie(a,b),
    easy:  (a,b) => lv(a)-lv(b) || sh(b)-sh(a) || tie(a,b),
    hard:  (a,b) => lv(b)-lv(a) || sh(b)-sh(a) || tie(a,b),
    topic: (a,b) => a.topic.localeCompare(b.topic) || a.qtype.localeCompare(b.qtype) || lv(a)-lv(b) || tie(a,b)
  }[f.sort];
  return rows.sort(by);
}

/* ---------- Learn: one topic as a guided flow ---------- */
const L = { t:null, steps:[], i:0, max:0, jump:null, quiz:null };
function loadLearnMem(){ try { return JSON.parse(localStorage.getItem('mw-learn')||'{}') || {}; } catch(e){ return {}; } }
function saveLearnMem(){ if (!L.t) return; try { const m = loadLearnMem(); m[L.t] = {i:L.i, max:L.max}; localStorage.setItem('mw-learn', JSON.stringify(m)); } catch(e){} }
function buildSteps(t){
  const steps = [{k:'overview'}];
  for (const c of conceptsOf(t)){ steps.push({k:'concept', id:c.id}); for (const q of kidsOf(c.id).filter(n => n.kind==='qtype')) steps.push({k:'qtype', id:q.id}); }
  steps.push({k:'quiz'});
  return steps;
}
/* spec: start:<topic> | resume:<topic> | quiz:<topic> | concept:<id> | qtype:<id> (opens at the first concept, with a link down to the type) */
async function openLearn(spec){
  const [k, id] = String(spec).split(':');
  const t = (k === 'qtype' || k === 'concept') ? topicOf(id) : id;
  if (!isBuiltTopic(t)) return;
  const same = L.t === t && L.steps.length;
  L.t = t; L.jump = null; if (!same){ L.steps = []; L.i = 0; L.max = 0; L.quiz = null; }
  setView('learn');
  await loadShard(t);
  if (L.t !== t) return;
  if (!same) L.steps = buildSteps(t);
  const mem = loadLearnMem()[t] || {i:0, max:0};
  const at = (kind, rid) => Math.max(0, L.steps.findIndex(s => s.k === kind && (rid == null || s.id === rid)));
  if (k === 'start'){ L.i = 0; L.max = 0; }
  else if (k === 'resume'){ L.i = Math.min(mem.i || 0, L.steps.length - 1); L.max = Math.max(mem.max || 0, L.i); }
  else if (k === 'quiz'){ L.i = at('quiz'); L.max = Math.max(L.max, L.i); L.quiz = null; }
  else if (k === 'concept'){ L.i = at('concept', id); L.max = Math.max(L.max, L.i); }
  else if (k === 'qtype'){ L.i = Math.min(1, L.steps.length - 1); L.max = Math.max(L.max, L.i); L.jump = id; }
  saveLearnMem(); renderLearn(true);
}

/* quiz inside Learn */
function quizList(t, scope){
  const d = S.sd[t], lv = x => LEVELS.indexOf(x.level), cmp = (a,b) => lv(a)-lv(b) || a.id.localeCompare(b.id);
  if (scope === 'wrong'){
    const out = [];
    for (const q of typesOf(t)) [...d.byId.values()].filter(x => x.qtype === q.id && S.prog[x.id] && !S.prog[x.id].r).sort(cmp).forEach(x => out.push({id:x.id, phase: x.src === 'pyq' ? 'Past question' : x.variant === 'harder' ? 'Challenge' : 'Practice'}));
    return out;
  }
  const out = [], types = scope === 'all' ? typesOf(t).map(n => n.id) : [scope];
  for (const qid of types){
    d.pyqs.filter(p => p.qtype === qid).sort(cmp).forEach(x => out.push({id:x.id, phase:'Past question'}));
    const pr = d.practice.filter(p => p.qtype === qid);
    pr.filter(p => p.variant !== 'harder').sort(cmp).forEach(x => out.push({id:x.id, phase:'Practice'}));
    pr.filter(p => p.variant === 'harder').sort(cmp).forEach(x => out.push({id:x.id, phase:'Challenge'}));
  }
  return out;
}
function startQuiz(scope){

}

function quizMenu(t, d){

function quizSummary(t, d){

function answerLearn(x, key){

$('lmain').addEventListener('click', e => {

  else if (b.hasAttribute('data-qprev')){ if (L.quiz && L.quiz.pos > 0){ L.quiz.pos--; renderLearn(true); } }
  else if (b.hasAttribute('data-qend')){ if (L.quiz){ L.quiz.done = true; renderLearn(true); } }
  else if (b.hasAttribute('data-qmenu')){ L.quiz = null; renderLearn(true); }
  else if (b.dataset.go != null){ const id = b.dataset.go; setView('web'); select(id || null); }
  else if (b.dataset.view){ setView(b.dataset.view); }
});
$('lhead').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view); });
$('outline').addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (b) learnGo(+b.dataset.step); });
$('otoggle').addEventListener('click', () => $('outline').classList.toggle('open'));
document.addEventListener('keydown', e => {
  if (S.view !== 'learn' || !L.quiz || L.quiz.done || /^(INPUT|SELECT|TEXTAREA)$/.test((e.target||{}).tagName||'') || e.metaKey || e.ctrlKey || e.altKey) return;
  const d = S.sd[L.t]; if (!d) return; const en = L.quiz.list[L.quiz.pos], x = d.byId.get(en.id), done = !!L.quiz.ans[x.id];
  if (!done && 'abcd'.includes(e.key) && e.key.length === 1 && x.options['abcd'.indexOf(e.key)] != null) answerLearn(x, e.key);
  else if (done && (e.key === 'Enter' || e.key === 'ArrowRight')){ e.preventDefault(); quizNext(); }
});

/* ---------- Sources ---------- */
const KIND = {'similar-paper':'Similar paper (made by a coaching institute, not the official paper)', official:'Official paper', memory:'Memory-based paper'};
const pcache = {};
function renderSources(){
  if (!S.loaded) { $('sources').innerHTML = '<p class="empty-msg">Loading…</p>'; return; }
  const ps = [...S.papers].sort((a,b) => (b.date||'').localeCompare(a.date||'') || a.shift - b.shift);
  const filed = ps.reduce((a,p) => a + p.n, 0), built = ps.reduce((a,p) => a + (p.built||0), 0);
  const byTopic = {}; (S.refs||[]).forEach(r => (byTopic[r.topic] = byTopic[r.topic] || []).push(r));
  $('sources').innerHTML = `<div class="srcwrap">
    <div><p class="eyebrow">Sources</p><h2>Where every question comes from</h2></div>
    <p class="lead" style="margin:0;font-family:var(--body);font-size:16px;line-height:1.55">${plural(ps.length,'paper')}, ${filed} Quant questions filed, ${built} of them already built into quizzes. Every filed answer was recomputed from the question's own numbers. Practice questions are written fresh, with their answers worked out twice by different methods.</p>
    <div class="section"><p class="eyebrow">Papers</p>${ps.map(p => `<div class="pcard" data-pid="${esc(p.id)}">
      <h3>${esc(p.exam)} · ${fmtDate(p.date)} · Shift ${p.shift}</h3>
      <div class="meta-row"><span>${esc(p.publisher)}</span><span>${esc(KIND[p.kind] || p.kind)}</span><span>Quant ${esc(p.quant)}</span><span>${p.n} filed</span><span>${p.built||0} built into quizzes</span></div>
      <div class="chips">${Object.entries(p.topics||{}).map(([t,c]) => `<span class="chip" style="cursor:default"><i style="background:${color(t)}"></i>${esc((S.nodes.get(t)||{}).label || t)} <span class="n">${c}</span></span>`).join('')}</div>
      <div class="chips">${p.link ? `<a class="ext" href="${esc(p.link)}" target="_blank" rel="noopener">Open the paper ↗</a>` : ''}<button type="button" class="btn-link" data-plist="${esc(p.id)}">Show the question list</button></div>
      <div class="tscroll" data-plist-box hidden></div></div>`).join('')}</div>
    <div class="section"><p class="eyebrow">Outside reading (links and notes, nothing copied)</p>
      ${Object.entries(byTopic).map(([t, rs]) => `<div class="pcard"><h3>${esc((S.nodes.get(t)||{}).label || t)}</h3><ul class="rows">${rs.map(r => `<li style="display:block"><a class="ext" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)} ↗</a><div class="note">${esc(r.note)}</div></li>`).join('')}</ul></div>`).join('') || '<p class="empty-msg">None yet.</p>'}</div>
    <p class="note">The first three papers are similar papers, not official CGL papers, so the counts show that publisher's style. Likelihood stays provisional until official papers are added.</p></div>`;
}
$('sources').addEventListener('click', async e => {
  const b = e.target.closest('[data-plist]'); if (!b) return;
  const card = b.closest('.pcard'), box = card.querySelector('[data-plist-box]'), id = b.dataset.plist;
  if (!box.hidden){ box.hidden = true; b.textContent = 'Show the question list'; return; }
  box.hidden = false; b.textContent = 'Hide the question list';
  if (!box.dataset.done){
    box.innerHTML = '<p class="empty-msg">Loading…</p>';
    try { const d = await (pcache[id] = pcache[id] || get('data/papers/' + id + '.json'));
      box.innerHTML = `<table class="plist"><thead><tr><th>Q</th><th>Topic</th><th>Answer</th><th>Checked</th></tr></thead><tbody>${d.rows.map(r => `<tr><td>${r.qno}</td><td>${esc((S.nodes.get(r.topic)||{}).label || r.topic)}</td><td>(${esc(r.key)}) ${esc(r.answer)}</td><td>${r.verified ? 'yes' : 'no'}</td></tr>`).join('')}</tbody></table>`; box.dataset.done = '1'; }
    catch(err){ box.innerHTML = '<p class="empty-msg">Could not load this paper list.</p>'; }
  }
});

/* ---------- views and routing ---------- */
function setView(v){
  S.view = v;
  $('bank').hidden = v !== 'bank'; $('learn').hidden = v !== 'learn'; $('sources').hidden = v !== 'sources'; document.querySelector('.layout').hidden = v !== 'web';
  $('show').hidden = v !== 'web';
  [...$('tabs').querySelectorAll('button')].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v || (v === 'learn' && b.dataset.view === 'bank'))));
  let h = '';
  if (v === 'bank') h = S.bankTab === 'mixed' ? '#practice' : '#bank';
  else if (v === 'learn') h = '#learn-' + L.t;
  else if (v === 'sources') h = '#sources';
  else if (S.sel) h = '#' + S.sel;
  try { history.replaceState(null, '', h || location.pathname + location.search); } catch(e){}
  if (v === 'bank') renderBank();
  else if (v === 'learn') renderLearn(true);
  else if (v === 'sources') renderSources();
  else { requestAnimationFrame(maybeFit); renderPanel(); }
  if (v !== 'web') window.scrollTo(0, 0);
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.view === 'bank') S.bankTab = S.bankTab || 'topic'; setView(b.dataset.view); });
$('btabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.bankTab = b.dataset.bt; setView('bank'); });
$('filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-reset')){ S.f = {topic:'', qtype:'', level:new Set(), lik:new Set(), src:'', status:'', tech:'', sort:S.f.sort}; }
  else if (b.dataset.f){ const k = b.dataset.f, v = b.dataset.v;
    if (S.f[k] instanceof Set){ S.f[k].has(v) ? S.f[k].delete(v) : S.f[k].add(v); } else S.f[k] = v; }
  S.shown = 20; renderBank();
});
$('filters').addEventListener('change', e => { const s = e.target.closest('select'); if (!s) return; S.f[s.dataset.sel] = s.value;
  if (s.dataset.sel === 'topic') S.f.qtype = '';
  if (s.dataset.sel === 'qtype' && s.value) S.f.topic = topicOf(s.value) || S.f.topic;
  S.shown = 20; renderBank(); });

/* answering a card (mixed practice) and the clicks that lead into Learn */
function onQuizClick(e){
  const card = e.target.closest('.qz'); if (!card) return false;
  const o = e.target.closest('button.opt'), rv = e.target.closest('[data-reveal]');
  if (!o && !rv) return false;
  const key = card.dataset.key, id = card.dataset.id;
  const verdict = card.querySelector('.verdict'), box = card.querySelector('.rv');
  if (o && !o.disabled){
    card.querySelectorAll('button.opt').forEach(x => { x.disabled = true; if (x.dataset.k === key) x.classList.add('right'); });
    const ok = o.dataset.k === key; if (!ok) o.classList.add('wrong');
    verdict.className = 'verdict ' + (ok ? 'ok' : 'no');
    verdict.textContent = ok ? 'Correct.' : `Not quite. The answer is (${key}).`;
    S.prog[id] = {r: ok ? 1 : 0}; saveProg();
    box.hidden = false; const rb = card.querySelector('[data-reveal]'); if (rb) rb.hidden = true;
  } else if (rv){
    card.querySelectorAll('button.opt').forEach(x => { x.disabled = true; if (x.dataset.k === key) x.classList.add('right'); });
    verdict.className = 'verdict'; verdict.textContent = `The answer is (${key}).`; box.hidden = false; rv.hidden = true;
  }
  return true;
}
/* a question-type node of a built topic goes straight into Learn; everything else selects the node */
function activate(id){
  const n = S.nodes.get(id);
  if (n && n.kind === 'qtype' && isBuiltTopic(topicOf(id))){ openLearn('qtype:' + id); return; }
  select(id || null);
}
document.addEventListener('click', e => {
  const l = e.target.closest('[data-learn]'); if (l && !e.target.closest('#lmain')){ openLearn(l.getAttribute('data-learn')); return; }
  const v = e.target.closest('[data-view]'); if (v && !e.target.closest('#lmain') && !e.target.closest('#lhead') && !e.target.closest('#tabs')){ setView(v.dataset.view); return; }
});
$('panel').addEventListener('click', e => {
  if (e.target.closest('[data-learn]') || e.target.closest('[data-view]')) return;
  const bk = e.target.closest('[data-bank]'); if (bk){ openBank(bk.getAttribute('data-bank')); return; }
  const b = e.target.closest('[data-go]'); if(!b) return;
  const id = b.getAttribute('data-go');
  if (S.q && id){ S.q=''; $('q').value=''; drawWeb(); }
  activate(id || null);
  $('panel').scrollTop = 0;
});
$('cards').addEventListener('click', e => {
  if (onQuizClick(e)) return;
  if (e.target.closest('[data-more]')){ S.shown += 20; renderBank(); return; }
});
$('bytopic').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b){ setView('web'); select(b.getAttribute('data-go') || null); } });
$('webcrumb').addEventListener('click', e => { if (e.target.closest('[data-zoomout]')) zoomOutWeb(); });

/* ---------- state changes ---------- */
/* Keep the web zoomed to the neighbourhood of whatever got selected: a built topic (or anything inside
   one) pulls the web in to show just its own concepts and types; anything else pulls back to the map. */
function syncWebFocus(id){
  const n = id && S.nodes.get(id);
  let want = null;
  if (n){
    if (n.kind === 'topic' && kidsOf(id).length) want = id;
    else if (n.kind === 'concept' || n.kind === 'qtype'){ const t = topicOf(id); if (t && kidsOf(t).length) want = t; }
  }
  if (want !== S.webFocus){ S.webFocus = want; if (S.view === 'web') drawWeb(); }
}
function zoomOutWeb(){
  if (!S.webFocus) return;
  S.webFocus = null;
  drawWeb();
  renderPanel();
}
function select(id){
  S.sel = id && S.nodes.has(id) ? id : null;
  if (S.sel) syncWebFocus(S.sel);
  else if (S.webFocus){ S.webFocus = null; if (S.view === 'web') drawWeb(); }
  try { if (S.sel) history.replaceState(null,'','#'+S.sel); else history.replaceState(null,'',location.pathname+location.search); } catch(e){}
  applyHighlight(); renderPanel();
}
function route(h){
  if (h === 'bank' || h === 'practice'){ S.bankTab = h === 'practice' ? 'mixed' : 'topic'; setView('bank'); return true; }
  if (h === 'sources'){ setView('sources'); return true; }
  if (h.startsWith('learn-')){ const t = h.slice(6); if (isBuiltTopic(t)){ openLearn('resume:' + t); return true; } }
  return false;
}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1);
  if (route(h)) return;
  if (S.view !== 'web') setView('web');
  if (h !== (S.sel||'')) select(h||null); });
$('show').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return;
  S.show = b.dataset.v; [...$('show').querySelectorAll('button')].forEach(x => x.setAttribute('aria-pressed', String(x===b)));
  drawWeb(); });
let qt; $('q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim(); if(S.q){ S.sel=null; if (S.view!=='web') setView('web'); } drawWeb(); renderPanel(); }, 160); });

function renderHeader(){
  const js = [...S.nodes.values()].filter(n=>parentOf(n)==='hub').length;
  const topics = [...S.nodes.values()].filter(n=>n.kind==='topic');
  const nIdx = Object.values(S.tmeta).reduce((a,m)=>a+m.indexed,0);
  $('sub').textContent = S.status==='none' ? 'Data files did not load' : (S.loaded ? 'SSC CGL Tier 1 and Tier 2 Quant, built from past questions' : 'Loading the web…');
  $('stats').innerHTML = S.nodes.size ? `<span><b>${js}</b> subjects</span><span><b>${topics.length}</b> topics</span><span><b>${topics.filter(t=>S.built.has(t.id)).length}</b> built</span><span><b>${nIdx}</b> past questions filed</span><span><b>${S.rows.length}</b> in the bank</span><span><b>${S.papers.length}</b> papers</span>` : '';
  const note = $('note');
  if (S.status==='none'){ note.hidden=false; note.textContent='The data files did not load. Refresh to try again.'; }
  else if (!S.loaded){ note.hidden=false; note.textContent='Loading the web…'; }
  else note.hidden = true;
}
function schedule(){ requestAnimationFrame(() => { derive(); paintJunctions(); renderHeader(); drawWeb();
  const h = location.hash.slice(1);
  if (route(h)) return;
  if (h && S.nodes.has(h) && !S.sel) { S.sel = h; applyHighlight(); }
  renderPanel(); }); }
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (S.view==='web') fit(false); }, 200); });

renderHeader(); renderPanel();
(async () => {
  try {
    const c = await get('data/core.json');
    S.nodes = new Map(Object.entries(c.nodes).map(([id,n]) => [id, Object.assign({id}, n)]));
    S.papers = c.papers; S.stats = c.stats.all || S.stats; S.tmeta = c.topics; S.techniques = c.techniques; S.rubric = c.rubric; S.likNote = c.likelihood; S.refs = c.refs || [];
    const cols = c.bank.cols; S.rows = c.bank.rows.map(r => Object.fromEntries(cols.map((k,i) => [k, r[i]])));
    S.loaded = true; S.status = 'ok';
    schedule();
  } catch (e) { console.error(e); S.status = 'none'; renderHeader(); renderPanel(); }
})();
})();
</script>
</body>
