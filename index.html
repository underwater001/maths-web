<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SSC CGL Quant question bank: every topic on one page — concepts, formulas, tricks and traps first, then the question types that repeat, then past and practice questions from easiest to hardest, each tagged by difficulty, how often it is asked and when it last came.">
<title>Maths Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Three places only: the syllabus (every topic), one page per topic (study then questions), and mixed practice. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#eaeef3; --ink:#18212c; --muted:#5a6575; --line:#d6dce5;
  --accent:#2448c8; --new:#c97a06; --new-soft:#fbefd9; --hi:#b3261e; --hi-soft:#fde4e1;
  --ok:#1d7a46; --ok-soft:#e3f4ea;
  --display:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#151c25; --sunk:#1b2430; --ink:#e4e9f0; --muted:#97a2b2; --line:#2a3441;
  --accent:#86a2ff; --new:#ffb84a; --new-soft:#3a2b10; --hi:#ff8a80; --hi-soft:#3d1714;
  --ok:#6fd39b; --ok-soft:#143325; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#151c25; --sunk:#1b2430; --ink:#e4e9f0; --muted:#97a2b2; --line:#2a3441;
  --accent:#86a2ff; --new:#ffb84a; --new-soft:#3a2b10; --hi:#ff8a80; --hi-soft:#3d1714;
  --ok:#6fd39b; --ok-soft:#143325; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px}
.page{max-width:1100px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 48px;display:flex;flex-direction:column;gap:14px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px}
.brand h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-0.015em;line-height:1.1}
.brand p{margin:3px 0 0;font-family:var(--mono);font-size:12px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:0;z-index:20;background:var(--bg);padding-block:6px}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;font:inherit;font-size:15px;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13px;font-weight:500;padding:8px 13px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

h2{margin:0;font-size:23px;font-weight:800;letter-spacing:-0.01em;line-height:1.15;text-wrap:balance}
h3{margin:0;font-size:16px;font-weight:700}
h4{margin:0 0 4px;font-size:12px;font-weight:700;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
p.lead{margin:0;font-family:var(--body);font-size:16px;line-height:1.55}
.note{margin:0;font-family:var(--body);font-size:14px;line-height:1.5;color:var(--muted)}
.empty-msg{margin:0;padding:18px;text-align:center;color:var(--muted);font-family:var(--body)}
.statline{margin:0;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.statline b{color:var(--ink);font-weight:500}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.crumbs button{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
.crumbs button:hover{text-decoration:underline}

.btn{font:inherit;font-size:14px;font-weight:700;padding:9px 15px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn:focus-visible,.chip:focus-visible,.qbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:50%;flex:none}
.chip .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"] .n{color:var(--surface);opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.qbtn{font:inherit;font-size:13px;font-weight:500;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}

/* tags */
.tag{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.lvl{font-family:var(--mono);font-size:11px;font-weight:500;padding:2px 7px;border-radius:5px}
.lvl-Easy{background:var(--ok-soft);color:var(--ok)}
.lvl-Medium{background:var(--new-soft);color:var(--new)}
.lvl-Hard{background:var(--hi-soft);color:var(--hi)}
.lik-high{background:var(--hi-soft);color:var(--hi)}
.lik-medium{background:var(--new-soft);color:var(--new)}
.lik-low,.lik-not-seen{background:var(--sunk);color:var(--muted)}
.tag.when{color:var(--accent)}
.tag.most{background:var(--accent);color:#fff}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}

/* syllabus */
.subject{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.subject>.shead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;border-top:2px solid var(--c,var(--line));padding-top:8px}
.subject>.shead h3{font-size:17px;letter-spacing:-.01em}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.tcard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c,var(--line));border-radius:10px;padding:13px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.tcard:hover{border-color:var(--muted);border-left-color:var(--c,var(--muted))}
.tcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tcard .tt{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tcard h4{margin:0;font-family:var(--display);font-size:15.5px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--ink);line-height:1.25}
.tcard .sub{margin:0;font-family:var(--body);font-size:13.5px;line-height:1.45;color:var(--muted)}
.tcard .meta{display:flex;flex-wrap:wrap;gap:3px 10px;font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tcard.todo{opacity:.72}
.bar{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .ok{background:var(--ok)} .bar .no{background:var(--hi)}
.tlist{display:flex;flex-wrap:wrap;gap:4px}
.tlist button{font:inherit;font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);background:var(--sunk);color:var(--muted);cursor:pointer}
.tlist button:hover{color:var(--ink);border-color:var(--muted)}

/* topic page */
.thead{display:flex;flex-direction:column;gap:8px}
.jump{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:52px;z-index:10;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line)}
.sect{display:flex;flex-direction:column;gap:12px;padding-top:22px;scroll-margin-top:122px}
.sect>.hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.sect>.hd h3{font-size:19px;letter-spacing:-.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.card.lead-c{border-left:3px solid var(--c,var(--line))}
.formula{background:var(--sunk);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:3px}
.formula .tx{font-family:var(--mono);font-size:13px;line-height:1.5;color:var(--ink);overflow-x:auto}
.formula .nt{font-family:var(--body);font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-family:var(--body);font-size:14.5px;line-height:1.5}
ul.plain li::marker{color:var(--muted)}
.kv{display:flex;flex-direction:column;gap:8px}
.kv .row{display:flex;flex-direction:column;gap:2px}
.kv .row .k{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kv .row .v{font-family:var(--body);font-size:14.5px;line-height:1.5}
details.more{border-top:1px solid var(--line);padding-top:9px}
details.more>summary{font-family:var(--mono);font-size:12px;color:var(--accent);cursor:pointer;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸ ";}
details.more[open]>summary::before{content:"▾ ";}
details.more>div{padding-top:10px;display:flex;flex-direction:column;gap:9px}
.pattern{background:var(--sunk);border-radius:8px;padding:9px 11px;font-family:var(--body);font-size:14.5px;line-height:1.5}
.pattern b{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:2px;font-weight:500}

/* questions */
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.q>p{margin:0;font-family:var(--body);font-size:15.5px;line-height:1.55}
.qnum{font-family:var(--mono);font-size:11px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px}
.opt{font:inherit;font-size:14.5px;text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:7px;font-family:var(--body)}
.opt span{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right span{color:var(--ok)}
.opt.wrong{border-color:var(--hi);background:var(--hi-soft)}
.opt.wrong span{color:var(--hi)}
.rv{display:flex;flex-direction:column;gap:11px;border-top:1px solid var(--line);padding-top:11px}
.rv h4{margin:0 0 3px}
.rv ol,.rv ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-family:var(--body);font-size:14.5px;line-height:1.5}
.verdict{font-family:var(--mono);font-size:12px;font-weight:500}
.verdict.r{color:var(--ok)} .verdict.w{color:var(--hi)}
.trick{font-family:var(--body);font-size:14.5px;line-height:1.5;background:var(--sunk);border-radius:7px;padding:8px 10px}
ul.wn{list-style:none;padding:0}
ul.wn li{display:flex;flex-direction:column;gap:1px;border-left:2px solid var(--line);padding-left:9px}
ul.wn b{font-family:var(--mono);font-size:12.5px;font-weight:500}
ul.wn span{font-family:var(--body);font-size:14px;color:var(--muted)}
ul.wn em{font-family:var(--mono);font-style:normal;font-size:11px;color:var(--hi)}
ul.wn em.bound{color:var(--muted)}
.qlist{display:flex;flex-direction:column;gap:10px}
.more-btn{font:inherit;font-size:14px;padding:11px;border-radius:9px;border:1px dashed var(--line);background:transparent;color:var(--accent);cursor:pointer;width:100%}

/* practice filters */
.bank{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:108px}
.filters .f{display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.filters select{font:inherit;font-size:13px;font-family:var(--display);text-transform:none;letter-spacing:0;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);width:100%}
.tg{display:flex;flex-wrap:wrap;gap:4px}
.tg button{font:inherit;font-family:var(--display);font-size:12.5px;text-transform:none;letter-spacing:0;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.tg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.fcount{font-family:var(--mono);font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}

/* sources */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
a.ext{font-family:var(--mono);font-size:12.5px;color:var(--accent)}
table.plist{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
table.plist th,table.plist td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.plist th{color:var(--muted);font-weight:500}
.tscroll{overflow-x:auto}

@media (max-width: 860px){
  .bank{grid-template-columns:minmax(0,1fr)}
  .filters{position:static}
  .jump{top:0;position:static}
  .controls{position:static}
  .sect{scroll-margin-top:12px}
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand">
      <h1>Maths Web</h1>
      <p id="sub">Loading…</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="controls">
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search a topic, formula, trick or question" autocomplete="off" aria-label="Search">
    </label>
    <div class="seg tabs" role="group" aria-label="View" id="tabs">
      <button type="button" data-view="syllabus" aria-pressed="true">Syllabus</button>
      <button type="button" data-view="practice" aria-pressed="false">Mixed practice</button>
      <button type="button" data-view="sources" aria-pressed="false">Sources</button>
    </div>
  </div>

  <main>
    <section id="syllabus" aria-label="Syllabus"></section>
    <section id="topic" hidden aria-label="Topic"></section>
    <section id="practice" hidden aria-label="Mixed practice">
      <div class="bank">
        <aside class="filters" id="filters"></aside>
        <div class="qlist" id="cards"></div>
      </div>
    </section>
    <section id="sources" hidden aria-label="Sources"></section>
    <section id="searchres" hidden aria-label="Search results"></section>
  </main>
</div>

<script>
(function(){
"use strict";
const S = { nodes:new Map(), papers:[], stats:{papers:0,topics:{},qtypes:{}}, tmeta:{}, rows:[], techniques:{}, likNote:'', refs:[],
            sd:{}, sp:{}, q:'', view:'syllabus', topic:null, typeFilter:'', shownQ:20, shown:20, loaded:false, status:'loading',
            cnt:new Map(), built:new Set(), mostAsked:new Set(), prog:{},
            f:{topic:'', qtype:'', level:new Set(), lik:new Set(), src:'', status:'', tech:'', sort:'asked'} };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const plural = (n, w) => `${n} ${w}${n===1?'':'s'}`;
const LEVELS = ['Easy','Medium','Hard'];
const LIKS = [['high','High'],['medium','Medium'],['low','Low']];
const LAYERS = [['standard','Standard method'],['fast','Fast method'],['ultra','Ultra-calc trick'],['eliminate','Eliminate from the options']];

/* ---------- progress (this browser only) ---------- */
function loadProg(){ try { return JSON.parse(localStorage.getItem('mw-progress')||'{}') || {}; } catch(e){ return {}; } }
function saveProg(){ try { localStorage.setItem('mw-progress', JSON.stringify(S.prog)); } catch(e){} }
S.prog = loadProg();

/* ---------- the node graph ---------- */
function parentOf(n){ const p = n && n.parent; return (p && p !== 'hub' && S.nodes.has(p)) ? p : 'hub'; }
function junctionOf(id){ let cur = S.nodes.get(id), guard = 0; while(cur && parentOf(cur) !== 'hub' && guard++ < 20) cur = S.nodes.get(parentOf(cur)); return cur ? cur.id : null; }
function topicOf(id){ let cur = S.nodes.get(id), guard = 0; while(cur && cur.kind !== 'topic' && guard++ < 20) cur = S.nodes.get(parentOf(cur)); return cur && cur.kind==='topic' ? cur.id : null; }
function color(id){ const j = junctionOf(id); return j ? `var(--j-${j})` : 'var(--muted)'; }
function kidsOf(id){ return [...S.nodes.values()].filter(m => parentOf(m)===id).sort((a,b)=>(a.order??999)-(b.order??999)||a.label.localeCompare(b.label)); }
function linksOf(id){ const s = new Set(); const n = S.nodes.get(id); (n && n.links || []).forEach(x => S.nodes.has(x) && s.add(x)); for(const m of S.nodes.values()) if((m.links||[]).includes(id)) s.add(m.id); s.delete(id); return s; }
const paper = id => S.papers.find(p => p.id === id);
const qstat = id => S.stats.qtypes[id], tstat = id => S.stats.topics[id];
const isBuiltTopic = t => !!(t && S.tmeta[t] && S.tmeta[t].built);
const conceptsOf = t => kidsOf(t).filter(n => n.kind === 'concept');
const typesOf = t => conceptsOf(t).flatMap(c => kidsOf(c.id).filter(n => n.kind === 'qtype'));
function subCount(id){ let t = S.cnt.get(id)||0; kidsOf(id).forEach(k => t += subCount(k.id)); return t; }
function derive(){
  S.cnt = new Map();
  for (const n of S.nodes.values()){
    let c = 0;
    if (n.kind === 'qtype') c = (qstat(n.id)||{}).n || 0;
    else if (n.kind === 'topic' && !kidsOf(n.id).length) c = (tstat(n.id)||{}).n || 0;
    S.cnt.set(n.id, c);
  }
  S.built = new Set(Object.entries(S.tmeta).filter(([,m]) => m.built).map(([t]) => t));
  S.mostAsked = new Set(Object.entries(S.stats.qtypes)
    .sort((a,b)=> b[1].shifts-a[1].shifts || b[1].n-a[1].n || a[0].localeCompare(b[0])).slice(0,6).map(([id])=>id));
}
/* One hue per subject, spread evenly, so colours stay stable as subjects are added. */
function paintJunctions(){
  const js = [...S.nodes.values()].filter(n => parentOf(n)==='hub' && n.kind !== 'topic').sort((a,b)=>(a.order??999)-(b.order??999));
  let light = '', dark = '';
  js.forEach((j,i) => { const h = Math.round(((j.hue != null) ? j.hue : (i*360/Math.max(js.length,1) + 18)) % 360);
    light += `--j-${j.id}:oklch(0.56 0.15 ${h});`; dark += `--j-${j.id}:oklch(0.78 0.12 ${h});`; });
  const st = document.createElement('style');
  st.textContent = `:root{${light}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${dark}}}:root[data-theme="dark"]{${dark}}`;
  document.head.appendChild(st);
}

/* ---------- data: core once, one shard per topic on demand ---------- */
const get = async (p, v) => {
  if (window.__DATA__ && window.__DATA__[p]) return window.__DATA__[p];
  const r = await fetch(p + '?v=' + (v || Date.now()), {cache: v ? 'default' : 'no-store'}); if (!r.ok) throw new Error(p + ' ' + r.status); return r.json();
};
function loadShard(t){
  if (!t || !isBuiltTopic(t)) return Promise.resolve(null);
  if (!S.sp[t]) S.sp[t] = get('data/shards/' + t + '.json', S.tmeta[t].v).then(d => {
    d.byId = new Map([...d.pyqs.map(x => [x.id, Object.assign({src:'pyq', topic:t}, x)]), ...d.practice.map(x => [x.id, Object.assign({src:'practice', topic:t}, x)])]);
    S.sd[t] = d; return d;
  }).catch(e => { console.error(e); S.sp[t] = null; return null; });
  return S.sp[t];
}
const allBuilt = () => [...S.built];

/* ---------- small pieces ---------- */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = d => { const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(d||''); return m ? `${+m[3]} ${MONTHS[+m[2]-1]} ${m[1]}` : (d||''); };
const lvlTag = (lv, title) => `<span class="lvl lvl-${esc(lv)}"${title?` title="${esc(title)}"`:''}>${esc(lv)}</span>`;
const likKey = l => String(l||'not seen').replace(' ','-');
const likTag = st => { const l = st ? st.lik : 'not seen'; const n = S.stats.papers;
  return `<span class="tag lik-${likKey(l)}" title="${st ? `Asked in ${st.shifts} of ${n} analysed shifts` : 'Not seen in the papers analysed so far'}">${l==='not seen'?'not seen yet':'repeats: '+l}</span>`; };
const techTag = k => `<span class="tag">${esc(S.techniques[k] || k)}</span>`;
const formulaHtml = f => `<div class="formula"><span class="tx">${esc(f.text)}</span>${f.note?`<span class="nt">${esc(f.note)}</span>`:''}</div>`;
function whyText(w){ if(!w) return ''; const b=[`${w.steps} step${w.steps===1?'':'s'}`]; if(w.concepts>1) b.push(`${w.concepts} concepts`); if(w.heavy) b.push('heavy numbers'); if(w.trap) b.push('a common-mistake option'); return 'Why: '+b.join(', '); }
/* When it was asked. Plain text; the paper's link lives on the Sources page. */
function whenTag(x){
  if (x.src !== 'pyq') return `<span class="tag">${x.variant==='harder'?'extra · one level harder':'extra practice'}</span>`;
  const p = paper(x.paper) || {};
  return `<span class="tag when" title="${esc([p.exam, p.publisher].filter(Boolean).join(' · '))}">asked ${fmtDate(p.date)}${p.shift?` S${p.shift}`:''} · Q${x.qno}</span>`;
}
function qTags(x){
  const st = qstat(x.qtype), qn = S.nodes.get(x.qtype), pr = S.prog[x.id];
  return `<div class="tags">${lvlTag(x.level, whyText(x.why))}${likTag(st)}${S.mostAsked.has(x.qtype)?`<span class="tag most">most asked</span>`:''}${whenTag(x)}${qn?`<span class="tag">${esc(qn.short||qn.label)}</span>`:''}${pr?`<span class="tag ${pr.r?'lik-medium':'lik-high'}">${pr.r?'you got it right':'you got it wrong'}</span>`:''}</div>`;
}
const methodOf = x => ((S.sd[x.topic] || {methods:{}}).methods || {})[x.qtype] || {};
const optBtns = (x, chosen) => x.options.map((o,i)=>{ const k='abcd'[i]; const cls = chosen ? (k===x.key?' right':(k===chosen?' wrong':'')) : '';
  return `<button type="button" class="opt${cls}" data-k="${k}"${chosen?' disabled':''}><span>(${k})</span>${esc(o)}</button>`; }).join('');
function revealInner(x){
  const m = methodOf(x);
  const sol = Array.isArray(x.solution) ? `<ol>${x.solution.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>` : `<p class="note" style="color:var(--ink)">${esc(x.solution)}</p>`;
  const wr = Object.entries(x.wrong||{}).map(([k,w]) => `<li><b>(${k}) ${esc(x.options['abcd'.indexOf(k)])}</b><span>${esc(w.note)} <em class="${w.kind}">${w.kind==='mistake'?'common mistake':'ruled out'}</em></span></li>`).join('');
  const fast = x.trick || m.fast;
  return `<div><h4>Solution</h4>${sol}</div>
    ${fast ? `<div><h4>${x.trick?'Fastest way in':'Fast method'}</h4><div class="trick">${esc(fast)}</div></div>` : ''}
    ${m.eliminate ? `<div><h4>Eliminate using the options</h4><div class="trick">${esc(m.eliminate)}</div></div>` : ''}
    ${wr ? `<div><h4>Why not the others</h4><ul class="wn">${wr}</ul></div>` : ''}
    ${(m.traps||[]).length ? `<div><h4>Traps in this type</h4><ul class="plain">${m.traps.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>` : ''}
    ${(x.tech||[]).length ? `<div class="tags">${x.tech.map(techTag).join('')}</div>` : ''}`;
}
/* One question. Answer stays hidden until an option is picked or the answer is asked for. */
function qCard(x, n){
  const pr = S.prog[x.id];
  return `<div class="q qz" data-id="${esc(x.id)}" data-topic="${esc(x.topic)}" data-key="${esc(x.key)}">
    ${n!=null?`<span class="qnum">Question ${n}</span>`:''}
    ${qTags(x)}
    <p>${esc(x.text)}</p>
    <div class="opts">${optBtns(x)}</div>
    <div class="chips"><button type="button" class="qbtn" data-reveal>Show the answer</button>${pr?`<button type="button" class="qbtn" data-forget>Clear my answer</button>`:''}</div>
    <div class="rv" hidden><div class="verdict"></div>${revealInner(x)}</div>
  </div>`;
}
/* Clicks inside any question list: pick an option, or ask for the answer. */
function onQuestionClick(e){
  const box = e.target.closest('.qz'); if (!box) return false;
  const opt = e.target.closest('button.opt'), rev = e.target.closest('[data-reveal]'), forget = e.target.closest('[data-forget]');
  if (forget){ delete S.prog[box.dataset.id]; saveProg(); rerender(); return true; }
  if (!opt && !rev) return false;
  const d = S.sd[box.dataset.topic]; if (!d) return true;
  const x = d.byId.get(box.dataset.id); if (!x) return true;
  const rv = box.querySelector('.rv'), v = box.querySelector('.verdict');
  if (opt && !opt.disabled){
    const k = opt.dataset.k;
    S.prog[x.id] = {r: k === x.key ? 1 : 0}; saveProg();
    box.querySelector('.opts').innerHTML = optBtns(x, k);
    v.className = 'verdict ' + (k === x.key ? 'r' : 'w');
    v.textContent = k === x.key ? 'Right.' : `Not this one — the answer is (${x.key}).`;
  } else if (rev){
    box.querySelector('.opts').innerHTML = optBtns(x, x.key);
    v.className = 'verdict'; v.textContent = `The answer is (${x.key}).`;
  }
  rv.hidden = false;
  const btn = box.querySelector('[data-reveal]'); if (btn) btn.remove();
  return true;
}

/* ================= 1. SYLLABUS: every topic, grouped by subject ================= */
function topicRows(t){ return S.rows.filter(r => r.topic === t); }
function progOf(rows){ let tried=0, right=0; for (const r of rows){ const p = S.prog[r.id]; if (p){ tried++; if (p.r) right++; } } return {tried, right, wrong: tried-right}; }
function renderSyllabus(){
  const el = $('syllabus');
  if (!S.loaded){ el.innerHTML = '<p class="empty-msg">Loading the syllabus…</p>'; return; }
  const subs = [...S.nodes.values()].filter(n => parentOf(n) === 'hub' && n.kind !== 'topic').sort((a,b)=>(a.order??999)-(b.order??999));
  const allTopics = [...S.nodes.values()].filter(n => n.kind === 'topic');
  const builtN = allTopics.filter(t => S.built.has(t.id)).length;
  const p = progOf(S.rows);
  el.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:9px">
      <p class="eyebrow">SSC CGL Tier 1 and Tier 2 · Quant</p>
      <h2>The whole syllabus, topic by topic</h2>
      <p class="lead">Open a topic and you get it in one page: the concepts and formulas, the tricks and traps, the question types that keep repeating, then every question from easiest to hardest — each one tagged with how hard it is, how often that type is asked and when it last came.</p>
      <p class="statline"><b>${builtN}</b> of ${allTopics.length} topics ready · <b>${S.rows.length}</b> questions · <b>${Object.values(S.tmeta).reduce((a,m)=>a+m.indexed,0)}</b> past questions filed${p.tried?` · you have tried <b>${p.tried}</b>, <b>${p.right}</b> right`:''}</p>
    </div>
    ${S.mostAsked.size ? `<div class="sect"><div class="hd"><h3>Start here: the most asked question types</h3></div>
      <div class="chips">${[...S.mostAsked].map(id => { const st = qstat(id), n = S.nodes.get(id); if(!n) return '';
        return `<button type="button" class="chip" data-type="${esc(id)}"><i style="background:${color(id)}"></i>${esc(n.label)} <span class="n">${st.shifts}/${S.stats.papers} shifts</span></button>`; }).join('')}</div>
      <p class="note">${esc(S.likNote)}</p></div>` : ''}
    ${subs.map(j => {
      const ts = kidsOf(j.id).filter(n => n.kind === 'topic');
      if (!ts.length) return '';
      const n = ts.reduce((a,t) => a + ((tstat(t.id)||{}).n || 0), 0);
      return `<div class="subject" style="--c:${color(j.id)}">
        <div class="shead"><h3 style="color:${color(j.id)}">${esc(j.label)}</h3><span class="statline">${plural(ts.length,'topic')} · ${plural(n,'past question')}</span></div>
        <div class="tgrid">${ts.map(topicCard).join('')}</div></div>`;
    }).join('')}`;
}
function topicCard(t){
  const built = S.built.has(t.id), st = tstat(t.id), rows = topicRows(t.id), p = progOf(rows), types = typesOf(t.id);
  const filed = (S.tmeta[t.id]||{}).indexed || 0;
  const mix = LEVELS.map(l => `${rows.filter(r=>r.level===l).length} ${l.toLowerCase()}`).join(' · ');
  return `<div class="tcard${built?'':' todo'}" style="--c:${color(t.id)}" data-topic="${esc(t.id)}" role="button" tabindex="0">
    <div class="tt"><h4>${esc(t.label)}</h4>${st?likTag(st):''}</div>
    <p class="sub">${esc(t.summary||'')}</p>
    ${built ? `<div class="meta"><span>${plural(types.length,'question type')}</span><span>${rows.length} questions</span><span>${mix}</span></div>
      ${p.tried?`<div class="bar" title="${p.tried} tried, ${p.right} right"><i class="ok" style="width:${p.right/rows.length*100}%"></i><i class="no" style="width:${p.wrong/rows.length*100}%"></i></div><span class="meta">tried ${p.tried} of ${rows.length}, ${p.right} right</span>`:''}
      <div class="tlist">${types.slice(0,6).map(q=>`<button type="button" data-type="${esc(q.id)}">${esc(q.short||q.label)}</button>`).join('')}</div>`
    : `<div class="meta"><span>${filed ? plural(filed,'past question')+' filed, page coming' : 'nothing filed here yet'}</span></div>`}

}
$('syllabus').addEventListener('click', e => {
  const ty = e.target.closest('[data-type]'); if (ty){ openTopic(topicOf(ty.dataset.type), ty.dataset.type); return; }
  const tc = e.target.closest('[data-topic]'); if (tc) openTopic(tc.dataset.topic);
});
$('syllabus').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest('.tcard'); if (!card) return;
  e.preventDefault(); openTopic(card.dataset.topic);

/* ================= 2. TOPIC PAGE: study first, then the questions ================= */
async function openTopic(t, focusType){
  if (!t || !S.nodes.has(t)) return;
  S.topic = t; S.typeFilter = ''; S.shownQ = 20;
  setView('topic');
  try { history.replaceState(null, '', '#t/' + t + (focusType ? '/' + focusType : '')); } catch(e){}
  if (isBuiltTopic(t)){ renderTopic(); await loadShard(t); if (S.topic !== t) return; }
  renderTopic();
  if (focusType){ const el = document.getElementById('ty-' + focusType); if (el) el.scrollIntoView({block:'start'}); }
  else window.scrollTo(0, 0);
}
function renderTopic(){
  const el = $('topic'), t = S.topic, n = S.nodes.get(t);
  if (!n) return;
  const j = junctionOf(t), st = tstat(t), d = S.sd[t];
  const head = `<div class="thead">
    <div class="crumbs"><button type="button" data-home>Syllabus</button>${j?` › <span>${esc(S.nodes.get(j).label)}</span>`:''}</div>
    <h2 style="color:${color(t)}">${esc(n.label)}</h2>
    <p class="lead">${md(n.summary||'')}</p>
    ${st ? `<p class="statline"><b>Asked ${plural(st.n,'time')}</b> in ${st.shifts} of ${S.stats.papers} analysed shifts${st.perShift!=null?`, about ${st.perShift} per shift`:''} · ${likTag(st)}</p>` : `<p class="statline">Not seen yet in the ${plural(S.stats.papers,'shift')} analysed.</p>`}
  </div>`;
  if (!isBuiltTopic(t)){
    const filed = (S.tmeta[t]||{}).indexed || 0;
    el.innerHTML = head + `<div class="sect"><div class="card"><p class="lead">This topic's page is not built yet.</p>
      <p class="note">${filed ? `${plural(filed,'past question')} are already filed here and their answers are checked — they go live as soon as the topic gets its concepts, question types and methods.` : 'No past question has landed here yet.'} Send material on this topic and it gets built.</p></div></div>`;
    return;
  }
  if (!d){ el.innerHTML = head + '<p class="empty-msg">Loading this topic…</p>'; return; }
  const concepts = conceptsOf(t), types = typesOf(t), rows = topicRows(t), p = progOf(rows);
  el.innerHTML = head + `
    <div class="jump">
      <button type="button" class="qbtn" data-jump="study">Study</button>
      <button type="button" class="qbtn" data-jump="types">${plural(types.length,'question type')}</button>
      <button type="button" class="qbtn" data-jump="questions">${rows.length} questions</button>
      ${p.tried?`<span class="statline" style="align-self:center;margin-left:4px">tried ${p.tried}, ${p.right} right</span>`:''}
    </div>
    ${studySection(t, d, concepts, types)}
    ${typesSection(t, d, types)}
    ${questionsSection(t, d, types, rows)}`;
}
/* Study: the concepts and their formulas, then every trick and trap in the topic at a glance. */
function studySection(t, d, concepts, types){
  const tricks = types.map(q => { const m = d.methods[q.id]||{}; return {q, fast:m.fast, ultra:m.ultra}; }).filter(x => x.fast || x.ultra);
  const traps = []; types.forEach(q => (d.methods[q.id]||{}).traps?.forEach(x => traps.push({q, t:x})));
  return `<div class="sect" id="study">
    <div class="hd"><h3>Study this first</h3><span class="statline">${plural(concepts.length,'concept')} · ${plural(d.formulas.length,'formula')}</span></div>
    ${concepts.map((c,i) => {
      const fs = d.formulas.filter(f => f.node === c.id), rel = [...linksOf(c.id)].filter(x => S.nodes.get(x));
      return `<div class="card lead-c" style="--c:${color(t)}">
        <h3>${i+1}. ${esc(c.label)}</h3>
        ${c.summary?`<p class="lead">${md(c.summary)}</p>`:''}
        ${fs.length?`<div><h4>Formulas</h4><div class="grid2">${fs.map(formulaHtml).join('')}</div></div>`:''}
        ${rel.length?`<div class="tags"><span class="tag">also used in</span>${rel.map(r=>`<button type="button" class="chip" data-topic="${esc(topicOf(r)||r)}"><i style="background:${color(r)}"></i>${esc(S.nodes.get(r).label)}</button>`).join('')}</div>`:''}
      </div>`; }).join('')}
    ${tricks.length?`<div class="card"><h3>Tricks that save time</h3><ul class="plain">${tricks.map(x=>`<li><b>${esc(x.q.short||x.q.label)}:</b> ${esc(x.fast||x.ultra)}${x.fast&&x.ultra?` <em style="color:var(--muted)">Ultra: ${esc(x.ultra)}</em>`:''}</li>`).join('')}</ul></div>`:''}
    ${traps.length?`<div class="card"><h3>Traps to avoid</h3><ul class="plain">${traps.map(x=>`<li><b>${esc(x.q.short||x.q.label)}:</b> ${esc(x.t)}</li>`).join('')}</ul></div>`:''}
  </div>`;
}
/* Question types: the pattern that identifies each one, then how to solve it. */
function typesSection(t, d, types){
  return `<div class="sect" id="types">
    <div class="hd"><h3>The question types that repeat</h3><span class="statline">spot the pattern, then use its method</span></div>
    ${types.map((q,i) => {
      const m = d.methods[q.id]||{}, st = qstat(q.id), fs = (m.formulas||[]).map(f => d.formulas.find(x => x.id===f)).filter(Boolean);
      const nq = d.pyqs.filter(x=>x.qtype===q.id).length + d.practice.filter(x=>x.qtype===q.id).length;
      return `<div class="card lead-c" id="ty-${esc(q.id)}" style="--c:${color(t)}">
        <div class="tt" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline">
          <h3>${i+1}. ${esc(q.label)}</h3>
          <div class="tags">${likTag(st)}${S.mostAsked.has(q.id)?'<span class="tag most">most asked</span>':''}${st?`<span class="tag">${st.n} asked · ${st.shifts}/${S.stats.papers} shifts</span>`:''}</div>
        </div>
        ${q.summary?`<p class="note">${md(q.summary)}</p>`:''}
        ${m.cue?`<div class="pattern"><b>The pattern</b>${esc(m.cue)}</div>`:''}
        ${m.fast?`<div><h4>Fast method</h4><div class="trick">${esc(m.fast)}</div></div>`:''}
        <details class="more"><summary>Full method, formulas and traps</summary><div>
          ${fs.length?`<div><h4>Formulas</h4><div class="grid2">${fs.map(formulaHtml).join('')}</div></div>`:''}
          <div class="kv">${LAYERS.filter(([k])=>m[k]&&k!=='fast').map(([k,l])=>`<div class="row"><span class="k">${l}</span><span class="v">${esc(m[k])}</span></div>`).join('')}</div>
          ${(m.traps||[]).length?`<div><h4>Traps</h4><ul class="plain">${m.traps.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
          ${(m.variations||[]).length?`<div><h4>Variations you may see</h4><ul class="plain">${m.variations.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
          ${(m.tech||[]).length?`<div class="tags">${m.tech.map(techTag).join('')}</div>`:''}
        </div></details>
        <div class="chips"><button type="button" class="qbtn" data-only="${esc(q.id)}">Practise these ${nq} questions →</button></div>
      </div>`; }).join('')}
  </div>`;
}
/* Questions: easiest first, filtered by type if asked for. */
function orderedQuestions(t, d){
  const lv = x => LEVELS.indexOf(x.level);
  const typeOrder = typesOf(t).map(q=>q.id);
  return [...d.pyqs, ...d.practice].map(x => d.byId.get(x.id))
    .filter(x => !S.typeFilter || x.qtype === S.typeFilter)
    .sort((a,b) => lv(a)-lv(b) || (a.src===b.src?0:a.src==='pyq'?-1:1) || typeOrder.indexOf(a.qtype)-typeOrder.indexOf(b.qtype) || a.id.localeCompare(b.id));
}
function questionsSection(t, d, types, rows){
  const list = orderedQuestions(t, d), vis = list.slice(0, S.shownQ);
  const p = progOf(list.map(x=>({id:x.id})));
  return `<div class="sect" id="questions">
    <div class="hd"><h3>Questions, easiest first</h3><span class="statline">${list.length} shown${p.tried?` · tried ${p.tried}, ${p.right} right`:''}</span></div>
    <div class="chips">
      <button type="button" class="chip" data-only="" aria-pressed="${!S.typeFilter}">All types <span class="n">${rows.length}</span></button>
      ${types.map(q => { const c = d.pyqs.filter(x=>x.qtype===q.id).length + d.practice.filter(x=>x.qtype===q.id).length;
        return `<button type="button" class="chip" data-only="${esc(q.id)}" aria-pressed="${S.typeFilter===q.id}"><i style="background:${color(q.id)}"></i>${esc(q.short||q.label)} <span class="n">${c}</span></button>`; }).join('')}
    </div>
    <div class="qlist">${vis.map((x,i)=>qCard(x, i+1)).join('')}</div>
    ${list.length > vis.length ? `<button type="button" class="more-btn" data-moreq>Show ${Math.min(20, list.length-vis.length)} more (${list.length-vis.length} left)</button>` : ''}
  </div>`;
}
$('topic').addEventListener('click', e => {
  if (onQuestionClick(e)) return;
  const home = e.target.closest('[data-home]'); if (home){ setView('syllabus'); return; }
  const jump = e.target.closest('[data-jump]'); if (jump){ const el = document.getElementById(jump.dataset.jump); if (el) el.scrollIntoView({block:'start'}); return; }
  const only = e.target.closest('[data-only]');
  if (only){ S.typeFilter = only.dataset.only; S.shownQ = 20; renderTopic(); const q = document.getElementById('questions'); if (q) q.scrollIntoView({block:'start'}); return; }
  const moreq = e.target.closest('[data-moreq]'); if (moreq){ S.shownQ += 20; renderTopic(); return; }
  const tc = e.target.closest('[data-topic]'); if (tc) openTopic(tc.dataset.topic);
});

/* ================= 3. MIXED PRACTICE: everything, filtered ================= */
function matchRows(){
  const f = S.f;
  const rows = S.rows.filter(r => {
    if (!S.built.has(r.topic)) return false;
    if (f.topic && r.topic !== f.topic) return false;
    if (f.qtype && r.qtype !== f.qtype) return false;
    if (f.level.size && !f.level.has(r.level)) return false;
    if (f.lik.size){ const st = qstat(r.qtype); if (!st || !f.lik.has(st.lik)) return false; }
    if (f.src && r.src !== f.src) return false;
    if (f.tech && !(r.tech||[]).includes(f.tech)) return false;
    const pr = S.prog[r.id];
    if (f.status === 'new' && pr) return false;
    if (f.status === 'wrong' && !(pr && !pr.r)) return false;
    if (f.status === 'right' && !(pr && pr.r)) return false;
    return true;
  });
  const lv = r => LEVELS.indexOf(r.level), sh = r => (qstat(r.qtype)||{shifts:0}).shifts, nn = r => (qstat(r.qtype)||{n:0}).n;
  const tie = (a,b) => (a.src===b.src?0:a.src==='pyq'?-1:1) || a.id.localeCompare(b.id);
  return rows.sort({
    asked: (a,b) => sh(b)-sh(a) || nn(b)-nn(a) || lv(a)-lv(b) || tie(a,b),
    easy:  (a,b) => lv(a)-lv(b) || sh(b)-sh(a) || tie(a,b),
    hard:  (a,b) => lv(b)-lv(a) || sh(b)-sh(a) || tie(a,b),
    topic: (a,b) => a.topic.localeCompare(b.topic) || a.qtype.localeCompare(b.qtype) || lv(a)-lv(b) || tie(a,b)
  }[S.f.sort]);
}
const tg = (name, val, label, on) => `<button type="button" data-f="${name}" data-v="${esc(val)}" aria-pressed="${on}">${esc(label)}</button>`;
function renderFilters(n){
  const f = S.f, tops = allBuilt().sort((a,b)=>S.nodes.get(a).label.localeCompare(S.nodes.get(b).label));
  const types = [...S.nodes.values()].filter(x => x.kind==='qtype' && (!f.topic || topicOf(x.id)===f.topic) && isBuiltTopic(topicOf(x.id)));
  $('filters').innerHTML = `
    <div class="fcount">${n} question${n===1?'':'s'} match</div>
    <label class="f">Topic<select data-sel="topic"><option value="">All topics</option>${tops.map(t=>`<option value="${esc(t)}"${f.topic===t?' selected':''}>${esc(S.nodes.get(t).label)}</option>`).join('')}</select></label>
    <label class="f">Question type<select data-sel="qtype"><option value="">All types</option>${types.map(x=>`<option value="${esc(x.id)}"${f.qtype===x.id?' selected':''}>${esc(x.label)}</option>`).join('')}</select></label>
    <div class="f">Difficulty<div class="tg">${LEVELS.map(l=>tg('level',l,l,f.level.has(l))).join('')}</div></div>
    <div class="f">How often it repeats<div class="tg">${LIKS.map(([k,l])=>tg('lik',k,l,f.lik.has(k))).join('')}</div></div>
    <div class="f">Source<div class="tg">${tg('src','','Both',!f.src)}${tg('src','pyq','Past questions',f.src==='pyq')}${tg('src','practice','Extra practice',f.src==='practice')}</div></div>
    <label class="f">Technique<select data-sel="tech"><option value="">Any</option>${Object.entries(S.techniques).map(([k,l])=>`<option value="${esc(k)}"${f.tech===k?' selected':''}>${esc(l)}</option>`).join('')}</select></label>
    <div class="f">Your progress<div class="tg">${tg('status','','All',!f.status)}${tg('status','new','Not tried',f.status==='new')}${tg('status','wrong','Got wrong',f.status==='wrong')}${tg('status','right','Got right',f.status==='right')}</div></div>
    <label class="f">Sort<select data-sel="sort">${[['asked','Most asked first'],['easy','Easiest first'],['hard','Hardest first'],['topic','By topic and type']].map(([k,l])=>`<option value="${k}"${f.sort===k?' selected':''}>${l}</option>`).join('')}</select></label>
    <button type="button" class="qbtn" data-reset>Clear filters</button>
    <p class="statline">Repeats = how many of the ${S.stats.papers} analysed shifts had that question type.</p>`;
}
let bankToken = 0;
async function renderPractice(){
  if (!S.loaded) return;
  const tok = ++bankToken, rows = matchRows();
  renderFilters(rows.length);
  const vis = rows.slice(0, S.shown), cards = $('cards');
  if (!rows.length){ cards.innerHTML = '<p class="empty-msg">No question matches these filters. Clear one and try again.</p>'; return; }
  const topics = [...new Set(vis.map(r => r.topic))];
  if (topics.some(t => !S.sd[t])) cards.innerHTML = '<p class="empty-msg">Loading questions…</p>';
  await Promise.all(topics.map(loadShard));
  if (tok !== bankToken) return;
  cards.innerHTML = vis.map(r => qCard(S.sd[r.topic].byId.get(r.id))).join('')
    + (rows.length > vis.length ? `<button type="button" class="more-btn" data-more>Show ${Math.min(20, rows.length-vis.length)} more (${rows.length-vis.length} left)</button>` : '');
}
$('filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-reset')) S.f = {topic:'', qtype:'', level:new Set(), lik:new Set(), src:'', status:'', tech:'', sort:S.f.sort};
  else if (b.dataset.f){ const k = b.dataset.f, v = b.dataset.v;
    if (S.f[k] instanceof Set){ S.f[k].has(v) ? S.f[k].delete(v) : S.f[k].add(v); } else S.f[k] = v; }
  else return;
  S.shown = 20; renderPractice();
});
$('filters').addEventListener('change', e => {
  const s = e.target.closest('[data-sel]'); if (!s) return;
  S.f[s.dataset.sel] = s.value; if (s.dataset.sel === 'topic') S.f.qtype = '';
  S.shown = 20; renderPractice();
});
$('cards').addEventListener('click', e => {
  if (onQuestionClick(e)) return;
  if (e.target.closest('[data-more]')){ S.shown += 20; renderPractice(); }
});

/* ================= 4. SOURCES ================= */
const KIND = {'similar-paper':'Similar paper (made by a coaching institute, not the official paper)', official:'Official paper', memory:'Memory-based paper'};
const pcache = {};
function renderSources(){
  if (!S.loaded){ $('sources').innerHTML = '<p class="empty-msg">Loading…</p>'; return; }
  const ps = [...S.papers].sort((a,b) => (b.date||'').localeCompare(a.date||'') || a.shift - b.shift);
  const filed = ps.reduce((a,p) => a + p.n, 0), built = ps.reduce((a,p) => a + (p.built||0), 0);
  const byTopic = {}; (S.refs||[]).forEach(r => (byTopic[r.topic] = byTopic[r.topic] || []).push(r));
  $('sources').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:9px">
      <p class="eyebrow">Sources</p><h2>Where every question comes from</h2>
      <p class="lead">${plural(ps.length,'paper')}, ${filed} Quant questions filed, ${built} already built into topic pages. Every filed answer was recomputed from the question's own numbers; extra practice questions are written fresh and answered twice by different methods.</p>
    </div>
    <div class="sect"><div class="hd"><h3>Papers</h3></div>
      ${ps.map(p => `<div class="pcard" data-pid="${esc(p.id)}">
        <h3>${esc(p.exam)} · ${fmtDate(p.date)} · Shift ${p.shift}</h3>
        <p class="statline">${esc(p.publisher)} · ${esc(KIND[p.kind]||p.kind)} · Quant ${esc(p.quant)} · ${p.n} filed · ${p.built||0} built</p>
        <div class="chips">${Object.entries(p.topics||{}).map(([t,c]) => `<span class="chip" style="cursor:default"><i style="background:${color(t)}"></i>${esc((S.nodes.get(t)||{}).label||t)} <span class="n">${c}</span></span>`).join('')}</div>
        <div class="chips">${p.link?`<a class="ext" href="${esc(p.link)}" target="_blank" rel="noopener">Open the paper ↗</a>`:''}<button type="button" class="qbtn" data-plist="${esc(p.id)}">Show the question list</button></div>
        <div class="tscroll" data-plist-box hidden></div></div>`).join('')}
    </div>
    <div class="sect"><div class="hd"><h3>Outside reading</h3><span class="statline">links and notes, nothing copied</span></div>
      ${Object.entries(byTopic).map(([t,rs]) => `<div class="pcard"><h3>${esc((S.nodes.get(t)||{}).label||t)}</h3><ul class="plain">${rs.map(r=>`<li><a class="ext" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)} ↗</a><br><span class="note">${esc(r.note)}</span></li>`).join('')}</ul></div>`).join('') || '<p class="empty-msg">None yet.</p>'}
    </div>
    <p class="note">The first three papers are similar papers by a coaching institute, not official CGL papers, so the counts carry that publisher's style. How often a type repeats stays provisional until official papers are added.</p>`;
}
$('sources').addEventListener('click', async e => {
  const b = e.target.closest('[data-plist]'); if (!b) return;
  const card = b.closest('.pcard'), box = card.querySelector('[data-plist-box]'), id = b.dataset.plist;
  if (!box.hidden){ box.hidden = true; b.textContent = 'Show the question list'; return; }
  box.hidden = false; b.textContent = 'Hide the question list';
  if (box.dataset.done) return;
  box.innerHTML = '<p class="empty-msg">Loading…</p>';
  try { const d = await (pcache[id] = pcache[id] || get('data/papers/' + id + '.json'));
    box.innerHTML = `<table class="plist"><thead><tr><th>Q</th><th>Topic</th><th>Answer</th><th>Checked</th></tr></thead><tbody>${d.rows.map(r=>`<tr><td>${r.qno}</td><td>${esc((S.nodes.get(r.topic)||{}).label||r.topic)}</td><td>(${esc(r.key)}) ${esc(r.answer)}</td><td>${r.verified?'yes':'no'}</td></tr>`).join('')}</tbody></table>`;
    box.dataset.done = '1';
  } catch(err){ box.innerHTML = '<p class="empty-msg">Could not load this paper list.</p>'; }
});

/* ================= 5. SEARCH ================= */
let searchToken = 0;
async function renderSearch(){
  const el = $('searchres'), t = S.q.toLowerCase(), tok = ++searchToken;
  const need = allBuilt().filter(x => !S.sd[x]);
  if (need.length){ el.innerHTML = '<p class="empty-msg">Searching every built topic…</p>'; await Promise.all(need.map(loadShard)); if (tok !== searchToken || !S.q) return; }
  const topics = [...S.nodes.values()].filter(n => n.kind==='topic' && (n.label.toLowerCase().includes(t) || (n.summary||'').toLowerCase().includes(t)));
  const types = [...S.nodes.values()].filter(n => n.kind==='qtype' && n.label.toLowerCase().includes(t));
  const fs = [], qs = [];
  for (const b of allBuilt()){ const d = S.sd[b]; if (!d) continue;
    d.formulas.forEach(f => { if ((f.text+' '+(f.note||'')).toLowerCase().includes(t)) fs.push(f); });
    d.pyqs.forEach(x => { if ((x.text+' '+(x.solution||[]).join(' ')+' '+(x.trick||'')).toLowerCase().includes(t)) qs.push(d.byId.get(x.id)); });
  }
  const total = topics.length + types.length + fs.length + qs.length;
  el.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:8px"><p class="eyebrow">Search</p><h2>${total} ${total===1?'match':'matches'} for “${esc(S.q)}”</h2></div>
    ${topics.length?`<div class="sect"><div class="hd"><h3>Topics</h3></div><div class="chips">${topics.map(n=>`<button type="button" class="chip" data-topic="${esc(n.id)}"><i style="background:${color(n.id)}"></i>${esc(n.label)}</button>`).join('')}</div></div>`:''}
    ${types.length?`<div class="sect"><div class="hd"><h3>Question types</h3></div><div class="chips">${types.map(n=>`<button type="button" class="chip" data-type="${esc(n.id)}"><i style="background:${color(n.id)}"></i>${esc(n.label)}</button>`).join('')}</div></div>`:''}
    ${fs.length?`<div class="sect"><div class="hd"><h3>Formulas</h3></div>${fs.slice(0,12).map(f=>`<div class="card">${formulaHtml(f)}<div class="chips"><button type="button" class="chip" data-topic="${esc(topicOf(f.node)||'')}">${esc((S.nodes.get(f.node)||{}).label||'')}</button></div></div>`).join('')}</div>`:''}
    ${qs.length?`<div class="sect"><div class="hd"><h3>Past questions</h3></div><div class="qlist">${qs.slice(0,10).map(x=>qCard(x)).join('')}</div></div>`:''}
    ${total?'':'<p class="empty-msg">Nothing matched. Try a shorter word, a formula name or a number.</p>'}`;
}
$('searchres').addEventListener('click', e => {
  if (onQuestionClick(e)) return;
  const ty = e.target.closest('[data-type]'); if (ty){ openTopic(topicOf(ty.dataset.type), ty.dataset.type); return; }
  const tc = e.target.closest('[data-topic]'); if (tc && tc.dataset.topic) openTopic(tc.dataset.topic);
});

/* ================= views, routing, boot ================= */
const VIEWS = ['syllabus','topic','practice','sources','searchres'];
function setView(v){
  S.view = v;
  VIEWS.forEach(x => $(x).hidden = x !== v);
  const tab = v === 'topic' ? 'syllabus' : v === 'searchres' ? '' : v;
  [...$('tabs').querySelectorAll('button')].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === tab)));
  if (v !== 'topic'){
    let h = v === 'practice' ? '#practice' : v === 'sources' ? '#sources' : '';
    try { history.replaceState(null, '', h || location.pathname + location.search); } catch(e){}
  }
  rerender();
  if (v !== 'topic') window.scrollTo(0, 0);
}
function rerender(){
  if (S.view === 'syllabus') renderSyllabus();
  else if (S.view === 'topic') renderTopic();
  else if (S.view === 'practice') renderPractice();
  else if (S.view === 'sources') renderSources();
  else if (S.view === 'searchres') renderSearch();
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  if (S.q){ S.q = ''; $('q').value = ''; } setView(b.dataset.view); });
let qt; $('q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => {
  S.q = e.target.value.trim();
  if (S.q) setView('searchres'); else setView('syllabus');
}, 180); });

function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('t/')){ const [, t, ty] = h.split('/'); if (S.nodes.has(t)){ openTopic(t, ty); return true; } }
  if (h === 'practice'){ setView('practice'); return true; }
  if (h === 'sources'){ setView('sources'); return true; }
  if (h.startsWith('learn-') && S.nodes.has(h.slice(6))){ openTopic(h.slice(6)); return true; }   /* old links */
  if (S.nodes.has(h)){ const t = topicOf(h); if (t){ openTopic(t, S.nodes.get(h).kind === 'qtype' ? h : null); return true; } }
  return false;
}
window.addEventListener('hashchange', () => { if (!route() && S.view !== 'syllabus') setView('syllabus'); });

function renderHeader(){
  const topics = [...S.nodes.values()].filter(n => n.kind==='topic');
  const filed = Object.values(S.tmeta).reduce((a,m)=>a+m.indexed,0);
  $('sub').textContent = S.status==='none' ? 'The data files did not load — refresh to try again'
    : S.loaded ? 'SSC CGL Tier 1 and Tier 2 Quant, built from past questions' : 'Loading…';
  $('stats').innerHTML = S.nodes.size
    ? `<span><b>${topics.length}</b> topics</span><span><b>${topics.filter(t=>S.built.has(t.id)).length}</b> ready</span><span><b>${filed}</b> past questions</span><span><b>${S.rows.length}</b> in the bank</span><span><b>${S.papers.length}</b> papers</span>` : '';
}

renderHeader(); renderSyllabus();
(async () => {
  try {
    const c = await get('data/core.json');
    S.nodes = new Map(Object.entries(c.nodes).map(([id,n]) => [id, Object.assign({id}, n)]));
    S.papers = c.papers; S.stats = c.stats.all || S.stats; S.tmeta = c.topics; S.techniques = c.techniques; S.likNote = c.likelihood; S.refs = c.refs || [];
    const cols = c.bank.cols; S.rows = c.bank.rows.map(r => Object.fromEntries(cols.map((k,i)=>[k, r[i]])));
    S.loaded = true; S.status = 'ok';
    derive(); paintJunctions(); renderHeader();
    if (!route()) renderSyllabus();
  } catch (e){ console.error(e); S.status = 'none'; renderHeader(); $('syllabus').innerHTML = '<p class="empty-msg">The data files did not load. Refresh to try again.</p>'; }
})();
})();
</script>
</body>
</html>
